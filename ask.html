async function init(){
  // ?demo 를 붙이면 로딩 화면만 계속 보여줍니다 (모션 확인용)
  if(location.search.indexOf('demo')>-1){ loading(); return; }
  let h=location.hash.slice(1);
  try{ h=decodeURIComponent(h); }catch(e){}
  h=h.replace(/%7E/gi,'~');
  if(!h){ badLink(); return; }

  if(h.indexOf('~')>-1||/^[A-Za-z0-9_-]+$/.test(h)){
    const [id,dep]=h.split('~');
    if(!id){ badLink(); return; }
    const gs=dep?('https://script.google.com/macros/s/'+dep+'/exec'):GS_URL;
    if(!gs){ badLink(); return; }
    let cached=null;
    try{ const v=localStorage.getItem('mc-cfg-'+id); if(v) cached=JSON.parse(v); }catch(e){}
    const pull=async()=>{
      const r=await fetch(gs+'?cfg='+encodeURIComponent(id));
      const j=await r.json();
      if(!j.ok||!j.cfg) throw new Error('no config');
      try{ localStorage.setItem('mc-cfg-'+id,JSON.stringify(j.cfg)); }catch(e){}
      return j.cfg;
    };
    if(cached){
      CFG=cached; CFG.gs=gs; CFG.id=id;
      pull().then(()=>{}).catch(()=>{});
    }else{
      loading();
      try{
        CFG=await pull(); CFG.gs=gs; CFG.id=id;
      }catch(e){
        screen('⏳','내용을 불러오지 못했습니다',
          '인터넷 연결을 확인하고 새로고침해 주세요.<br>계속 같은 화면이면 사회자분께 알려 주세요.');
        return;
      }
    }
  }else{
    CFG=decode(h);
    if(!CFG){ badLink(); return; }
  }

  A.basic=Object.assign({date:CFG.date||'',time:CFG.time||'',venue:CFG.venue||'',floor:CFG.floor||''},A.basic);
  const d=CFG.def||{};
  STORY.forEach(q=>{ if(A.story[q.k]===undefined) A.story[q.k]=(q.type==='chips'?{sel:[],etc:''}:''); });
  SECS.forEach(s=>{
    A.secs[s.k]=A.secs[s.k]||{use:(d.on&&d.on[s.k]===false)?'off':'on',music:(d.music&&d.music[s.k])||'',note:''};
    (s.opts||[]).forEach(o=>{ if(A.opts[o.k]===undefined) A.opts[o.k]=d[o.k]!==undefined?d[o.k]:(o.v?o.v[0]:''); });
  });
  loadDraft();
  intro();
}

    <h1>${esc(c.bride||'신부')}<span class="h">♡</span>${esc(c.groom||'신랑')}</h1>

function screens(){
  let a=[{type:'basic'}].concat(STORY.map(q=>({type:'story',q}))).concat([{type:'fork'}]);
  if(A.skipSecs!==true) a=a.concat(SECS.map((s,i)=>({type:'sec',s,i})));
  return a.concat([{type:'last'}]);
}
function paint(){
  if(!BOUND){ bind(); BOUND=true; }
  VIEW==='card'?renderCard():renderList();
  count();
}

function topbar(){
  const n=screens().length;
  return `<div class="topbar">
    <span class="names">${esc(CFG.bride||'신부')} ♡ ${esc(CFG.groom||'신랑')}</span>
    ${VIEW==='card'?`<span class="step">${Math.min(IDX+1,n)} / ${n}</span>`:''}
    <button class="toggle" id="vToggle">${VIEW==='card'?'전체 보기':'한 장씩 보기'}</button>
  </div>`;
}
function filled(sc){
  if(sc.type==='story'){ const v=A.story[sc.q.k];
    return sc.q.type==='chips' ? !!((v.sel||[]).length||v.etc) : !!v; }
  if(sc.type==='sec') return A.secs[sc.s.k].use&&A.secs[sc.s.k].use!=='?';
  return true;
}
function dotsBar(){
  const S=screens();
  return `<div class="dots">${S.map((sc,i)=>
    `<i class="${i===IDX?'now':(filled(sc)?'on':'')}"></i>`).join('')}</div>`;
}
function nav(nextLabel){
  return `<div class="cardnav"><div class="in">
    ${IDX>0?`<button class="prev" id="cPrev">이전</button>`:''}
    <button class="next" id="cNext">${nextLabel}</button>
  </div></div>`;
}

function storyCard(q){
  const v=A.story[q.k];
  let body='';
  if(q.type==='area'){
    body=`<textarea data-sq="${q.k}" placeholder="${esc(q.ph||'')}">${esc(v||'')}</textarea>`;
  }else if(q.type==='pick'){
    body=`<div class="pick col">${q.v.map(x=>
      `<button data-sp="${q.k}" data-v="${esc(x)}" aria-pressed="${v===x}">${x}</button>`).join('')}</div>`;
  }else if(q.type==='chips'){
    const sel=(v&&v.sel)||[];
    body=`<div class="chips">${q.v.map(x=>
      `<button data-sc="${q.k}" data-v="${esc(x)}" aria-pressed="${sel.indexOf(x)>-1}">${x}</button>`).join('')}</div>
      <div class="f"><input type="text" data-se="${q.k}" value="${esc((v&&v.etc)||'')}" placeholder="${esc(q.ph||'')}"></div>`;
  }
  return `<div class="ribbon">두 분의 이야기</div>
    <h3 class="qt">${esc(q.t).replace(/\n/g,'<br>')}</h3>
    ${q.d?`<p class="desc">${esc(q.d)}</p>`:''}
    <div class="qbody">${body}</div>`;
}

function renderCard(){
  const S=screens(), n=S.length;
  IDX=Math.max(0,Math.min(IDX,n-1));
  const cur=S[IDX];
  if(cur.type==='last') return renderLast();
  if(cur.type==='fork') return renderFork();
  let inner='';
  if(cur.type==='basic'){
    inner=`<div class="ribbon">기본 확인</div>
      <h2>예식 정보</h2>
      <p class="desc">아래 내용이 맞는지 확인해 주세요.</p>
      ${bf('date','예식일','date')}${bf('time','예식 시작 시간','time')}
      ${bf('venue','예식장 · 홀 이름')}${bf('floor','피로연 연회장 위치','text','지하 1층')}`;
  }else if(cur.type==='story'){
    inner=storyCard(cur.q);
  }else{
    const s=cur.s, a=A.secs[s.k], off=a.use==='off';
    inner=`<div class="ribbon">식순 확인</div>
      <h2><span class="n">${String(cur.i+1).padStart(2,'0')}</span>${s.t}</h2>
      ${s.d?`<p class="desc">${s.d}</p>`:''}
      <div class="pick use">
        ${[['on','넣을게요'],['off','뺄게요'],['?','잘 모르겠어요']].map(([v,t])=>
          `<button data-use="${s.k}" data-v="${v}" aria-pressed="${a.use===v}">${t}</button>`).join('')}
      </div>
      <div class="detail ${off?'hide':''}" data-detail="${s.k}">${detail(s)}</div>`;
  }
  const nextLabel = S[IDX+1] && S[IDX+1].type==='last' ? '마무리하기'
    : (cur.type==='basic' ? '이야기 시작하기'
    : (cur.type==='story' && S[IDX+1].type==='sec' ? '식순 확인하기' : '다음 장 열기'));
  $('#app').innerHTML=`${topbar()}
  <div class="deck"><div class="peek b"></div><div class="peek"></div>
    <div class="card one">${inner}</div></div>
  ${dotsBar()}${nav(nextLabel)}`;
  window.scrollTo(0,0);
}

          ${o.v.map(v=>`<button data-optv="${o.k}" data-v="${esc(v)}" aria-pressed="${A.opts[o.k]===v}">${v}</button>`).join('')}
        </div></div>`).join('')}
    ${s.music?`<div class="f"><label>음악 (정해진 곡이 있다면)</label>
      <input type="text" data-mus="${s.k}" value="${esc(a.music)}" placeholder="이소라 - 청혼 / 웨딩홀 보유곡"></div>`:''}
    <div class="f"><label>이 순서에 요청하실 내용</label>
      <input type="text" data-note="${s.k}" value="${esc(a.note)}" placeholder="비워두셔도 됩니다"></div>`;
}

  const c=CFG;
  $('#app').innerHTML=`
  ${topbar()}
  <div class="sect-label">기본 확인</div>
  <div class="card">
    <p class="desc">아래 내용이 맞는지 확인해 주세요.</p>

    ${bf('venue','예식장 · 홀 이름')}${bf('floor','피로연 연회장 위치','text','지하 1층')}
  </div>

  <div class="sect-label">두 분의 이야기</div>
  ${STORY.map(q=>`<div class="card">${storyCard(q)}</div>`).join('')}

  ${A.skipSecs===true?'':`<div class="sect-label">식순 확인</div>
  ${SECS.map((s,i)=>card(s,i)).join('')}`}

  <div class="sect-label">마지막으로</div>
  <div class="card">
    <div class="f"><label>꼭 넣어 달라거나, 빼 달라고 하실 내용이 있다면 자유롭게 적어 주세요</label>
      <textarea id="free" placeholder="예: 아버지가 몸이 불편하셔서 이동을 줄여 주세요">${esc(A.free)}</textarea></div>
    <div class="f"><label>작성자 (누가 답해 주셨는지)</label>
      <input type="text" id="who" value="${esc(A.name)}" placeholder="김민주"></div>

function bf(k,label,type='text',ph=''){
  // 날짜·시간은 기기마다 렌더링이 다른 네이티브 picker(type=date/time) 대신
  // 텍스트 입력 + 자동 포맷으로 통일합니다 (PC/모바일/인앱 브라우저 간 크기 차이 방지).
  const fmt=type==='date'?'date':(type==='time'?'time':'');
  const inputType=fmt?'text':type;
  const extra=fmt?` inputmode="numeric" data-fmt="${fmt}" maxlength="${fmt==='date'?10:5}"`:'';
  const placeholder=fmt==='date'?'0000-00-00':(fmt==='time'?'00:00':ph);
  return `<div class="f"><label>${label}</label>
    <input type="${inputType}"${extra} data-b="${k}" value="${esc(A.basic[k]||'')}" placeholder="${esc(placeholder)}"></div>`;
}
/* 국제전화 형태(+82 10-…)로 넣으면 앞의 0이 빠져 어긋나므로 되살립니다 */
function normPhone(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0082')) d=d.slice(4);
  else if(d.startsWith('82')&&d.length>=11&&d.length<=13) d=d.slice(2);
  if((d.length===9||d.length===10)&&d[0]!=='0') d='0'+d;
  return d.slice(0,12);
}
function fmtPhone(raw){
  const d=normPhone(raw);
  if(d.length===12) return `${d.slice(0,4)}-${d.slice(4,8)}-${d.slice(8)}`; /* 0507 안심번호 */
  if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length===10) return d.startsWith('02')?`${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}`:`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===9&&d.startsWith('02')) return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;
  if(d.length>3) return `${d.slice(0,3)}-${d.slice(3)}`;
  return d;
}

/* 연락처 + 개인정보 동의 · 카드형/목록형 두 화면에서 같이 씁니다 */
function contactBlock(){
  const c=A.contact||{}, ok=!!(A.consent&&A.consent.agreed);
  return `<div class="f"><label>연락처 (두 분 중 한 분 것이면 충분합니다)</label>
      <input type="tel" inputmode="numeric" id="cPhone" data-fmt="phone" maxlength="14" value="${esc(c.phone||'')}" placeholder="010-0000-0000"></div>
    <div class="f"><label>카카오톡 ID 또는 오픈채팅 링크 <span class="opt">· 선택</span></label>
      <input type="text" id="cKakao" value="${esc(c.kakao||'')}" placeholder="비워두셔도 됩니다"></div>
    <div class="privacy" id="pvBox">
      <div class="ph">개인정보 수집·이용 동의 <b>(필수)</b></div>
      <ul>
        <li><span>수집 항목</span>${PRIVACY_ITEMS}</li>
        <li><span>이용 목적</span>${PRIVACY_PURPOSE}</li>
        <li><span>보유 기간</span>${PRIVACY_KEEP}</li>
      </ul>
      <p class="note">동의를 거부하실 수 있습니다. 다만 연락처가 없으면 예식을 준비하는 동안 연락을 드리기 어렵습니다.</p>
      <label class="agree"><input type="checkbox" id="cAgree"${ok?' checked':''}><span>위 내용을 확인했으며, 개인정보 수집·이용에 동의합니다.</span></label>
    </div>`;
}
function card(s,i){
  const a=A.secs[s.k], off=a.use==='off';
  return `<div class="card" data-card="${s.k}">
    <h2><span class="n">${String(i+1).padStart(2,'0')}</span>${s.t}</h2>
    ${s.d?`<p class="desc">${s.d}</p>`:''}
    <div class="pick use">
      ${[['on','넣을게요'],['off','뺄게요'],['?','잘 모르겠어요']].map(([v,t])=>
        `<button data-use="${s.k}" data-v="${v}" aria-pressed="${a.use===v}">${t}</button>`).join('')}
    </div>
    <div class="detail ${off?'hide':''}" data-detail="${s.k}">${detail(s)}</div>
  </div>`;
}

function bind(){
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.fmt==='date'){
      const digits=t.value.replace(/\D/g,'').slice(0,8);
      let v=digits.slice(0,4);
      if(digits.length>4) v+='-'+digits.slice(4,6);
      if(digits.length>6) v+='-'+digits.slice(6,8);
      t.value=v;
    }
    if(t.dataset.fmt==='time'){
      const digits=t.value.replace(/\D/g,'').slice(0,4);
      let v=digits.slice(0,2);
      if(digits.length>2) v+=':'+digits.slice(2,4);
      t.value=v;
    }
    if(t.dataset.b) A.basic[t.dataset.b]=t.value;
    if(t.dataset.sq) A.story[t.dataset.sq]=t.value;
    if(t.dataset.se) A.story[t.dataset.se].etc=t.value;
    if(t.dataset.opt) A.opts[t.dataset.opt]=t.value;
    if(t.dataset.mus) A.secs[t.dataset.mus].music=t.value;
    if(t.dataset.note) A.secs[t.dataset.note].note=t.value;
    if(t.dataset.fmt==='phone') t.value=fmtPhone(t.value);
    if(t.id==='free') A.free=t.value;
    if(t.id==='who') A.name=t.value;
    if(t.id==='cPhone'){ A.contact.phone=t.value; }
    if(t.id==='cKakao'){ A.contact.kakao=t.value; }
    saveDraft();
  });
  document.addEventListener('change',e=>{
    if(e.target.id!=='cAgree') return;
    /* 동의한 시점과 문구 버전을 함께 남깁니다 — 나중에 "무엇에 동의했는지" 확인할 수 있어야 하므로 */
    A.consent=e.target.checked?{agreed:true,at:new Date().toISOString(),ver:PRIVACY_VER}:null;
    const box=document.getElementById('pvBox');
    if(box&&e.target.checked) box.classList.remove('need');
    saveDraft();
  });
  document.addEventListener('click',e=>{
    const u=e.target.closest('[data-use]');
    if(u){
      A.secs[u.dataset.use].use=u.dataset.v;
      [...u.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===u));
      const d=document.querySelector(`[data-detail="${u.dataset.use}"]`);
      if(d) d.classList.toggle('hide',u.dataset.v==='off');
      saveDraft(); count();
      const db=document.querySelector('.dots');
      if(db&&VIEW==='card') db.innerHTML=SECS.map((x,i)=>
        `<i class="${i+1===IDX?'now':(A.secs[x.k].use&&A.secs[x.k].use!=='?'?'on':'')}"></i>`).join('');
    }
    const sp=e.target.closest('[data-sp]');
    if(sp){
      A.story[sp.dataset.sp]=sp.dataset.v;
      [...sp.parentNode.children].forEach(x=>x.setAttribute('aria-pressed',x===sp));
      saveDraft(); count();
    }
    const sc=e.target.closest('[data-sc]');
    if(sc){
      const st=A.story[sc.dataset.sc]; st.sel=st.sel||[];
      const v=sc.dataset.v, i=st.sel.indexOf(v);
      if(i>-1) st.sel.splice(i,1); else st.sel.push(v);
      sc.setAttribute('aria-pressed', i<0);
      saveDraft(); count();
    }
    const o=e.target.closest('[data-optv]');
    if(o){
      A.opts[o.dataset.optv]=o.dataset.v;
      [...o.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===o));
      saveDraft();
    }
    if(e.target.id==='send') send();
    if(e.target.id==='vToggle'){ VIEW=VIEW==='card'?'list':'card'; paint(); }
    if(e.target.id==='cNext'){ IDX++; paint(); }
    if(e.target.id==='cPrev'){ IDX--; paint(); }
  });
}
function count(){
  const S=screens();
  const done=S.filter(filled).length;
  const left=S.length-done;
  const el=$('#cnt');
  const bar=$('#progBar');
  if(bar) bar.style.width=(VIEW==='card'?(IDX+1)/S.length*100:done/S.length*100)+'%';
  if(!el) return;
  el.textContent=left?`${S.length}개 중 ${done}개 작성 · 나머지는 비워두셔도 됩니다`:'모두 작성하셨습니다';
}

async function send(){
  /* 동의 없이는 연락처를 받지 않습니다 — 체크 전에는 전송 자체를 막습니다 */
  if(!(A.consent&&A.consent.agreed)){
    const box=document.getElementById('pvBox');
    if(box){
      box.classList.add('need');
      box.scrollIntoView({behavior:'smooth',block:'center'});
    }
    const cb=document.getElementById('cAgree');
    if(cb) cb.focus({preventScroll:true});
    return;
  }
  const btn=$('#send'); btn.disabled=true; btn.textContent='보내는 중…';
  const payload={id:CFG.id,ts:new Date().toISOString(),name:A.name,basic:A.basic,opts:A.opts,secs:A.secs,story:A.story,skipSecs:A.skipSecs===true,free:A.free,
    contact:A.contact,consent:A.consent};
  try{
    if(!CFG.gs) throw new Error('no endpoint');
    const r=await fetch(CFG.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'fail');
    try{ localStorage.removeItem(draftKey()); }catch(e){}
    done();
  }catch(err){
    btn.disabled=false; btn.textContent='다시 보내기';
    fallback(payload);
  }
}
function done(){
  $('#app').innerHTML=`<div class="done"><div class="ic">✓</div>
    <h2>전달했습니다</h2>
    <p>답변이 사회자에게 잘 전달됐습니다.<br>수정할 내용이 생기면 이 링크로 다시 들어와 보내주시면 됩니다.</p></div>`;
  window.scrollTo(0,0);
}
function fallback(payload){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_');
  let box=$('#fb');
  if(!box){
    box=document.createElement('div'); box.id='fb'; box.className='fallback';
    $('.wrap').appendChild(box);
  }
  box.innerHTML=`<p class="err">지금 전송이 되지 않았습니다. 아래 코드를 복사해서 사회자에게 보내주세요.</p>
    <textarea readonly id="fbc">${code}</textarea>
    <button class="btn primary" style="width:100%" id="fbcopy">코드 복사하기</button>`;
  $('#fbcopy').onclick=()=>{
    const t=$('#fbc'); t.select();
    navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));
    $('#fbcopy').textContent='복사했습니다';
  };
  box.scrollIntoView({behavior:'smooth'});
}

init();
</script>
