<style>
:root{
  --paper:#EDEFF2;--card:#fff;--ink:#15171C;--ink2:#5C636D;--ink3:#8A919B;
  --line:#DCE0E6;--line2:#EDF0F3;--wine:#8A2540;--wine-soft:#F6E9ED;--gold:#A9863A;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 160px}
header{padding:36px 4px 24px}
header .dt{font-size:12px;letter-spacing:.12em;color:var(--ink2)}
header h1{font-size:30px;font-weight:900;letter-spacing:-.04em;margin:8px 0 0}
header h1 .h{color:var(--wine);font-size:19px;margin:0 7px}
header p{font-size:15px;color:var(--ink2);margin:16px 0 0;word-break:keep-all}
/* 인트로 · 카드 흐름 */
.intro{min-height:84vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 8px}
.intro .dt{font-size:12px;letter-spacing:.12em;color:var(--ink3)}
.intro h1{font-size:28px;font-weight:900;letter-spacing:-.04em;margin:14px 0 0;line-height:1.4;word-break:keep-all}
.intro h1 .h{color:var(--wine);font-size:21px;margin:0 8px}
.intro .ribbon-top{margin-top:18px;font-size:12px;color:var(--wine);letter-spacing:.06em;font-weight:700}
.intro .rule{width:36px;height:1px;background:var(--wine);opacity:.5;margin:28px 0}
.intro p{font-size:16px;color:var(--ink2);line-height:2;margin:0;word-break:keep-all}
.intro .lead{color:var(--ink);font-size:18px;margin:0 0 26px}
.intro .go{margin-top:40px;background:var(--wine);border:0;color:#fff;border-radius:100px;
  padding:16px 44px;font-size:16px;font-weight:700;min-height:54px}
.topbar{position:sticky;top:0;z-index:4;background:var(--paper);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.topbar .step{font-size:12px;color:var(--ink3);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.topbar .names{font-size:13px;font-weight:700;letter-spacing:-.02em}
.topbar .toggle{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-size:12px;color:var(--ink2)}
.deck{position:relative;padding:6px 0 10px}
.deck .peek{position:absolute;left:8px;right:8px;top:0;height:26px;background:#fff;border:1px solid var(--line);border-radius:12px;opacity:.55}
.deck .peek.b{left:16px;right:16px;top:-7px;opacity:.3}
.card.one{position:relative;animation:slidein .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes slidein{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card.one .ribbon{font-size:12px;color:var(--wine);letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.cardnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.cardnav .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.cardnav .prev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px 18px;min-height:52px;color:var(--ink2)}
.cardnav .next{flex:1;background:var(--wine);border:0;color:#fff;border-radius:10px;padding:15px;font-size:16px;font-weight:700;min-height:52px}
.dots{display:flex;gap:5px;justify-content:center;padding:14px 0 0;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--wine)}
.dots i.now{width:18px;border-radius:3px;background:var(--wine)}
/* 8비트 튤립 로딩 */
.load{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.px{width:150px;height:auto}
.px .f1,.px .f2,.px .f3{opacity:0}
.px .f1{animation:pf1 1.26s steps(1) infinite}
.px .f2{animation:pf2 1.26s steps(1) infinite}
.px .f3{animation:pf3 1.26s steps(1) infinite}
@keyframes pf1{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes pf2{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes pf3{0%,65%{opacity:0}66%,100%{opacity:1}}
.load .msg{font-size:15px;color:var(--ink2);text-align:center;line-height:1.7}
.load .sub{font-size:13px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}
.load .dots::after{content:'';animation:dots 1.26s steps(1) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:700;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.02em}
.card h2 .n{font-size:12px;color:var(--ink3);font-weight:400}
.card .desc{font-size:14px;color:var(--ink2);margin:0 0 16px;word-break:keep-all;line-height:1.6}
.sect-label{font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:700;padding:28px 4px 12px}
.f{margin-top:16px}
.f label{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px;font-weight:500}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:14px 12px;background:#fff;font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--wine);outline:none}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{
  flex:1;min-width:84px;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:14px 8px;font-size:15px;color:var(--ink2);line-height:1.35;word-break:keep-all;min-height:52px;
}
.pick button[aria-pressed=true]{background:var(--wine-soft);border-color:var(--wine);color:var(--wine);font-weight:700}
.use .pick button[aria-pressed=true][data-v=off]{background:#F1F2F4;border-color:var(--ink3);color:var(--ink2)}
.qt{font-size:19px;font-weight:700;line-height:1.55;letter-spacing:-.02em;margin:0 0 6px;word-break:keep-all}
.qbody{margin-top:16px}
.qbody textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:14px 12px;font-size:16px;resize:vertical}
.qbody textarea:focus{border-color:var(--wine);outline:none}
.pick.col{flex-direction:column}
.pick.col button{min-height:52px}
.pick.col button .fs{display:block;font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:4px}
.pick.col button{padding:16px 12px;min-height:66px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:11px 16px;font-size:15px;color:var(--ink2);min-height:46px}
.chips button[aria-pressed=true]{background:var(--wine-soft);border-color:var(--wine);color:var(--wine);font-weight:700}
.detail{margin-top:16px;padding-top:4px;border-top:1px dashed var(--line)}
.detail.hide{display:none}
.prog{position:fixed;top:0;left:0;right:0;height:3px;background:var(--line2);z-index:5}
.prog i{display:block;height:100%;background:var(--wine);width:0;transition:width .25s}
.bar{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  backdrop-filter:blur(6px);
}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .cnt{font-size:13px;color:var(--ink2);flex:1;line-height:1.4}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px 20px;font-weight:500;font-size:16px;min-height:52px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700}
.btn:disabled{opacity:.5}
.done{text-align:center;padding:60px 20px}
.done .ic{font-size:38px}
.done h2{font-size:24px;margin:16px 0 8px;font-weight:700;letter-spacing:-.02em}
.done p{color:var(--ink2);font-size:15px;margin:0 0 20px;line-height:1.7}
.fallback{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;margin-top:20px}
.fallback textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;word-break:break-all;margin:10px 0}
.err{color:var(--wine);font-size:14px;line-height:1.6}
</style>

function decode(h){
  try{ return JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g,'+').replace(/_/g,'/'))))); }
  catch(e){ return null; }
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function screen(icon,title,body){
  $('#app').innerHTML=`<div class="done"><div class="ic">${icon}</div><h2>${title}</h2><p>${body}</p></div>`;
}

async function init(){
  // ?demo 를 붙이면 로딩 화면만 계속 보여줍니다 (모션 확인용)
  if(location.search.indexOf('demo')>-1){ loading(); return; }
  let h=location.hash.slice(1);
  try{ h=decodeURIComponent(h); }catch(e){}
  h=h.replace(/%7E/gi,'~');
  if(!h){ badLink(); return; }

  if(h.indexOf('~')>-1||/^[A-Za-z0-9_-]+$/.test(h)){
    const [id,dep]=h.split('~');
    if(!id){ badLink(); return; }
    const gs=dep?('https://script.google.com/macros/s/'+dep+'/exec'):GS_URL;
    if(!gs){ badLink(); return; }
    let cached=null;
    try{ const v=localStorage.getItem('mc-cfg-'+id); if(v) cached=JSON.parse(v); }catch(e){}
    const pull=async()=>{
      const r=await fetch(gs+'?cfg='+encodeURIComponent(id));
      const j=await r.json();
      if(!j.ok||!j.cfg) throw new Error('no config');
      try{ localStorage.setItem('mc-cfg-'+id,JSON.stringify(j.cfg)); }catch(e){}
      return j.cfg;
    };
    if(cached){
      CFG=cached; CFG.gs=gs; CFG.id=id;
      pull().then(()=>{}).catch(()=>{});
    }else{
      loading();
      try{
        CFG=await pull(); CFG.gs=gs; CFG.id=id;
      }catch(e){
        screen('⏳','내용을 불러오지 못했습니다',
          '인터넷 연결을 확인하고 새로고침해 주세요.<br>계속 같은 화면이면 사회자분께 알려 주세요.');
        return;
      }
    }
  }else{
    CFG=decode(h);
    if(!CFG){ badLink(); return; }
  }

  A.basic=Object.assign({date:CFG.date||'',time:CFG.time||'',venue:CFG.venue||'',floor:CFG.floor||''},A.basic);
  const d=CFG.def||{};
  STORY.forEach(q=>{ if(A.story[q.k]===undefined) A.story[q.k]=(q.type==='chips'?{sel:[],etc:''}:''); });
  SECS.forEach(s=>{
    A.secs[s.k]=A.secs[s.k]||{use:(d.on&&d.on[s.k]===false)?'off':'on',music:(d.music&&d.music[s.k])||'',note:''};
    (s.opts||[]).forEach(o=>{ if(A.opts[o.k]===undefined) A.opts[o.k]=d[o.k]!==undefined?d[o.k]:(o.v?o.v[0]:''); });
  });
  loadDraft();
  intro();
}

function screens(){
  let a=[{type:'basic'}].concat(STORY.map(q=>({type:'story',q}))).concat([{type:'fork'}]);
  if(A.skipSecs!==true) a=a.concat(SECS.map((s,i)=>({type:'sec',s,i})));
  return a.concat([{type:'last'}]);
}
function paint(){
  if(!BOUND){ bind(); BOUND=true; }
  VIEW==='card'?renderCard():renderList();
  count();
}

function topbar(){
  const n=screens().length;
  return `<div class="topbar">
    <span class="names">${esc(CFG.bride||'신부')} ♡ ${esc(CFG.groom||'신랑')}</span>
    ${VIEW==='card'?`<span class="step">${Math.min(IDX+1,n)} / ${n}</span>`:''}
    <button class="toggle" id="vToggle">${VIEW==='card'?'전체 보기':'한 장씩 보기'}</button>
  </div>`;
}
function filled(sc){
  if(sc.type==='story'){ const v=A.story[sc.q.k];
    return sc.q.type==='chips' ? !!((v.sel||[]).length||v.etc) : !!v; }
  if(sc.type==='sec') return A.secs[sc.s.k].use&&A.secs[sc.s.k].use!=='?';
  return true;
}
function dotsBar(){
  const S=screens();
  return `<div class="dots">${S.map((sc,i)=>
    `<i class="${i===IDX?'now':(filled(sc)?'on':'')}"></i>`).join('')}</div>`;
}
function nav(nextLabel){
  return `<div class="cardnav"><div class="in">
    ${IDX>0?`<button class="prev" id="cPrev">이전</button>`:''}
    <button class="next" id="cNext">${nextLabel}</button>
  </div></div>`;
}

function storyCard(q){
  const v=A.story[q.k];
  let body='';
  if(q.type==='area'){
    body=`<textarea data-sq="${q.k}" placeholder="${esc(q.ph||'')}">${esc(v||'')}</textarea>`;
  }else if(q.type==='pick'){
    body=`<div class="pick col">${q.v.map(x=>
      `<button data-sp="${q.k}" data-v="${esc(x)}" aria-pressed="${v===x}">${x}</button>`).join('')}</div>`;
  }else if(q.type==='chips'){
    const sel=(v&&v.sel)||[];
    body=`<div class="chips">${q.v.map(x=>
      `<button data-sc="${q.k}" data-v="${esc(x)}" aria-pressed="${sel.indexOf(x)>-1}">${x}</button>`).join('')}</div>
      <div class="f"><input type="text" data-se="${q.k}" value="${esc((v&&v.etc)||'')}" placeholder="${esc(q.ph||'')}"></div>`;
  }
  return `<div class="ribbon">두 분의 이야기</div>
    <h3 class="qt">${esc(q.t).replace(/\n/g,'<br>')}</h3>
    ${q.d?`<p class="desc">${esc(q.d)}</p>`:''}
    <div class="qbody">${body}</div>`;
}

function renderCard(){
  const S=screens(), n=S.length;
  IDX=Math.max(0,Math.min(IDX,n-1));
  const cur=S[IDX];
  if(cur.type==='last') return renderLast();
  if(cur.type==='fork') return renderFork();
  let inner='';
  if(cur.type==='basic'){
    inner=`<div class="ribbon">기본 확인</div>
      <h2>예식 정보</h2>
      <p class="desc">아래 내용이 맞는지 확인해 주세요.</p>
      ${bf('date','예식일','date')}${bf('time','예식 시작 시간','time')}
      ${bf('venue','예식장 · 홀 이름')}${bf('floor','피로연 연회장 위치','text','지하 1층')}`;
  }else if(cur.type==='story'){
    inner=storyCard(cur.q);
  }else{
    const s=cur.s, a=A.secs[s.k], off=a.use==='off';
    inner=`<div class="ribbon">식순 확인</div>
      <h2><span class="n">${String(cur.i+1).padStart(2,'0')}</span>${s.t}</h2>
      ${s.d?`<p class="desc">${s.d}</p>`:''}
      <div class="pick use">
        ${[['on','넣을게요'],['off','뺄게요'],['?','잘 모르겠어요']].map(([v,t])=>
          `<button data-use="${s.k}" data-v="${v}" aria-pressed="${a.use===v}">${t}</button>`).join('')}
      </div>
      <div class="detail ${off?'hide':''}" data-detail="${s.k}">${detail(s)}</div>`;
  }
  const nextLabel = S[IDX+1] && S[IDX+1].type==='last' ? '마무리하기'
    : (cur.type==='basic' ? '이야기 시작하기'
    : (cur.type==='story' && S[IDX+1].type==='sec' ? '식순 확인하기' : '다음 장 열기'));
  $('#app').innerHTML=`${topbar()}
  <div class="deck"><div class="peek b"></div><div class="peek"></div>
    <div class="card one">${inner}</div></div>
  ${dotsBar()}${nav(nextLabel)}`;
  window.scrollTo(0,0);
}

function bf(k,label,type='text',ph=''){
  return `<div class="f"><label>${label}</label>
    <input type="${type}" data-b="${k}" value="${esc(A.basic[k]||'')}" placeholder="${esc(ph)}"></div>`;
}
function card(s,i){
  const a=A.secs[s.k], off=a.use==='off';
  return `<div class="card" data-card="${s.k}">
    <h2><span class="n">${String(i+1).padStart(2,'0')}</span>${s.t}</h2>
    ${s.d?`<p class="desc">${s.d}</p>`:''}
    <div class="pick use">
      ${[['on','넣을게요'],['off','뺄게요'],['?','잘 모르겠어요']].map(([v,t])=>
        `<button data-use="${s.k}" data-v="${v}" aria-pressed="${a.use===v}">${t}</button>`).join('')}
    </div>
    <div class="detail ${off?'hide':''}" data-detail="${s.k}">${detail(s)}</div>
  </div>`;
}

function bind(){
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.b) A.basic[t.dataset.b]=t.value;
    if(t.dataset.sq) A.story[t.dataset.sq]=t.value;
    if(t.dataset.se) A.story[t.dataset.se].etc=t.value;
    if(t.dataset.opt) A.opts[t.dataset.opt]=t.value;
    if(t.dataset.mus) A.secs[t.dataset.mus].music=t.value;
    if(t.dataset.note) A.secs[t.dataset.note].note=t.value;
    if(t.id==='free') A.free=t.value;
    if(t.id==='who') A.name=t.value;
    saveDraft();
  });
  document.addEventListener('click',e=>{
    const u=e.target.closest('[data-use]');
    if(u){
      A.secs[u.dataset.use].use=u.dataset.v;
      [...u.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===u));
      const d=document.querySelector(`[data-detail="${u.dataset.use}"]`);
      if(d) d.classList.toggle('hide',u.dataset.v==='off');
      saveDraft(); count();
      const db=document.querySelector('.dots');
      if(db&&VIEW==='card') db.innerHTML=SECS.map((x,i)=>
        `<i class="${i+1===IDX?'now':(A.secs[x.k].use&&A.secs[x.k].use!=='?'?'on':'')}"></i>`).join('');
    }
    const sp=e.target.closest('[data-sp]');
    if(sp){
      A.story[sp.dataset.sp]=sp.dataset.v;
      [...sp.parentNode.children].forEach(x=>x.setAttribute('aria-pressed',x===sp));
      saveDraft(); count();
    }
    const sc=e.target.closest('[data-sc]');
    if(sc){
      const st=A.story[sc.dataset.sc]; st.sel=st.sel||[];
      const v=sc.dataset.v, i=st.sel.indexOf(v);
      if(i>-1) st.sel.splice(i,1); else st.sel.push(v);
      sc.setAttribute('aria-pressed', i<0);
      saveDraft(); count();
    }
    const o=e.target.closest('[data-optv]');
    if(o){
      A.opts[o.dataset.optv]=o.dataset.v;
      [...o.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===o));
      saveDraft();
    }
    if(e.target.id==='send') send();
    if(e.target.id==='vToggle'){ VIEW=VIEW==='card'?'list':'card'; paint(); }
    if(e.target.id==='cNext'){ IDX++; paint(); }
    if(e.target.id==='cPrev'){ IDX--; paint(); }
  });
}
function count(){
  const S=screens();
  const done=S.filter(filled).length;
  const left=S.length-done;
  const el=$('#cnt');
  const bar=$('#progBar');
  if(bar) bar.style.width=(VIEW==='card'?(IDX+1)/S.length*100:done/S.length*100)+'%';
  if(!el) return;
  el.textContent=left?`${S.length}개 중 ${done}개 작성 · 나머지는 비워두셔도 됩니다`:'모두 작성하셨습니다';
}

async function send(){
  const btn=$('#send'); btn.disabled=true; btn.textContent='보내는 중…';
  const payload={id:CFG.id,ts:new Date().toISOString(),name:A.name,basic:A.basic,opts:A.opts,secs:A.secs,story:A.story,skipSecs:A.skipSecs===true,free:A.free};
  try{
    if(!CFG.gs) throw new Error('no endpoint');
    const r=await fetch(CFG.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'fail');
    try{ localStorage.removeItem(draftKey()); }catch(e){}
    done();
  }catch(err){
    btn.disabled=false; btn.textContent='다시 보내기';
    fallback(payload);
  }
}
function done(){
  $('#app').innerHTML=`<div class="done"><div class="ic">✓</div>
    <h2>전달했습니다</h2>
    <p>답변이 사회자에게 잘 전달됐습니다.<br>수정할 내용이 생기면 이 링크로 다시 들어와 보내주시면 됩니다.</p></div>`;
  window.scrollTo(0,0);
}
function fallback(payload){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_');
  let box=$('#fb');
  if(!box){
    box=document.createElement('div'); box.id='fb'; box.className='fallback';
    $('.wrap').appendChild(box);
  }
  box.innerHTML=`<p class="err">지금 전송이 되지 않았습니다. 아래 코드를 복사해서 사회자에게 보내주세요.</p>
    <textarea readonly id="fbc">${code}</textarea>
    <button class="btn primary" style="width:100%" id="fbcopy">코드 복사하기</button>`;
  $('#fbcopy').onclick=()=>{
    const t=$('#fbc'); t.select();
    navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));
    $('#fbcopy').textContent='복사했습니다';
  };
  box.scrollIntoView({behavior:'smooth'});
}

init();
</script>
