<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 분의 이야기 · Everafter</title>
<meta name="theme-color" content="#F3F0EA">
<style>
:root{--paper:#F3F0EA;--card:#FFFEFB;--ink:#27231F;--ink2:#726A62;--line:#DED8CF;--wine:#8A2540;--wine2:#F4E7EB;--olive:#6F775D;--shadow:0 18px 50px rgba(48,39,31,.08);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--serif:"Iowan Old Style","Times New Roman",serif}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75}.wrap{max-width:680px;margin:auto;padding:32px 18px 100px}.brand{text-align:center;font-family:var(--serif);font-size:18px;letter-spacing:.12em}.subbrand{text-align:center;color:var(--ink2);font-size:11px;letter-spacing:.18em;margin-top:2px}.hero{text-align:center;padding:70px 16px 46px}.code{display:inline-block;margin-top:22px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--wine);font-size:12px;letter-spacing:.08em}.hero h1{font-size:30px;line-height:1.45;letter-spacing:-.04em;margin:28px 0 14px}.hero p{color:var(--ink2);margin:0;word-break:keep-all}.tulip{font-size:40px;margin:28px 0 0;filter:saturate(.72)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;margin:14px 0;box-shadow:var(--shadow)}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--wine);font-weight:700}.state h2{font-size:23px;letter-spacing:-.03em;margin:8px 0 12px}.state p{color:var(--ink2);margin:0}.next{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}.next b{display:block;color:var(--ink);margin-bottom:3px}.timeline{padding:8px 0}.step{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding:0 0 23px}.step:last-child{padding-bottom:0}.step:not(:last-child):before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line)}.dot{width:17px;height:17px;border:1.5px solid var(--line);border-radius:50%;background:var(--card);position:relative;z-index:1}.step.done .dot{background:var(--olive);border-color:var(--olive)}.step.now .dot{border-color:var(--wine);box-shadow:0 0 0 5px var(--wine2)}.step .title{font-size:15px;color:var(--ink2);line-height:1.35}.step.done .title{color:var(--ink)}.step.now .title{color:var(--wine);font-weight:700}.when{font-size:11px;color:var(--ink2);margin-top:4px}.letter{font-family:var(--serif);font-size:18px;line-height:2.05;white-space:pre-line}.quote{font-family:var(--serif);font-size:22px;line-height:1.65;text-align:center;padding:12px 8px;color:var(--wine)}button,.btn{display:block;width:100%;border:1px solid var(--wine);background:var(--wine);color:white;border-radius:12px;padding:15px 18px;font:700 15px var(--sans);text-align:center;text-decoration:none;cursor:pointer}.btn.light{background:transparent;color:var(--wine);margin-top:10px}.reply label{display:block;font-size:13px;color:var(--ink2);margin:18px 0 7px}.reply textarea,.reply input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;font:15px var(--sans}.reply textarea{min-height:110px;resize:vertical}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{width:auto;background:#fff;color:var(--ink2);border-color:var(--line);padding:10px 13px;font-weight:500}.chips button.on{background:var(--wine2);color:var(--wine);border-color:var(--wine)}.lookup{max-width:460px;margin:80px auto}.lookup h1{text-align:center;font-size:27px}.lookup p{text-align:center;color:var(--ink2)}.lookup input{width:100%;padding:15px;border:1px solid var(--line);border-radius:11px;margin:7px 0;background:#fff;font-size:16px}.error{text-align:center;color:var(--wine);padding:20px}.hide{display:none}.foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:42px}.foot b{font-family:var(--serif);color:var(--ink);font-size:15px}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const GS_URL='https://script.google.com/macros/s/AKfycbyULnOlwGCrwEjeqgocZhZjh8pMazeaEvl8H78vd7RV61aX9HKq0a6tS_0KWZcf7Ufjhg/exec';
const $=(s,r=document)=>r.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABELS=['처음 인사를 나누었어요','두 분의 이야기를 기다려요','첫 번째 대본이 준비되었어요','함께 다듬고 있어요','마지막 문장을 준비했어요','그날을 기다리고 있어요','오늘의 기억을 남겼어요'];
function normalize(v){const n=String(v||'').replace(/영애/gi,'').replace(/\D/g,'');return n.length===6?`${n.slice(0,4)}_${n.slice(4)}`:''}
function gsFromHash(){let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){};const [id,dep]=h.split('~');return {id,gs:dep?`https://script.google.com/macros/s/${dep}/exec`:GS_URL}}
function state(d){const s=d.steps||{};if(s.s10||s.s9)return {idx:6,title:'오늘의 기억을 남겼어요',msg:'두 분의 하루를 한 편의 편지로 남겨두었습니다.',next:'언제든 이곳에서 그날의 문장을 다시 만나보세요.'};if(s.s8)return {idx:6,title:'Everafter 편지를 전합니다',msg:'오래 기억될 하루와 오래 이어질 사랑을 담아 편지를 준비했습니다.',next:'편지를 읽은 뒤, 두 분의 오늘도 한 문장으로 들려주세요.'};if(s.s7)return {idx:5,title:'그날을 기다리고 있어요',msg:'두 분의 이야기를 모두 준비했습니다.',next:'예식 당일, 이 문장으로 두 분을 소개하겠습니다.'};if(s.s6)return {idx:4,title:'마지막 대본이 준비되었어요',msg:'두 분의 이야기를 담은 마지막 대본을 보내드렸습니다.',next:'마지막으로 두 분의 마음을 확인해 주세요.'};if(s.s5)return {idx:4,title:'마지막 문장을 다듬고 있어요',msg:'두 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분의 마지막 대본을 준비해 보내드릴게요.'};if(s.s4)return {idx:3,title:'두 번째 대본이 준비되었어요',msg:'두 분과 나눈 이야기를 다시 담아 대본을 다듬었습니다.',next:'더하고 싶은 이야기나 덜어내고 싶은 부분을 들려주세요.'};if(s.s3)return {idx:3,title:'함께 다듬고 있어요',msg:'첫 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분다운 문장으로 다시 정리해 보내드릴게요.'};if(s.s2)return {idx:2,title:'첫 번째 대본이 준비되었어요',msg:'두 분이 들려주신 이야기를 첫 번째 대본에 담았습니다.',next:'편하게 읽어보시고 두 분의 생각을 들려주세요.'};if(s.s1)return {idx:1,title:'두 분의 이야기를 기다리고 있어요',msg:'두 분다운 결혼식을 준비하기 위한 질문을 보내드렸습니다.',next:'한 문장이어도 충분합니다. 편하게 들려주세요.'};return {idx:0,title:'처음 인사를 나누었어요',msg:'두 분의 오래 기억될 하루를 함께 준비합니다.',next:'곧 두 분의 이야기를 들을 수 있는 질문을 보내드릴게요.'}}
function timeline(d,idx){const s=d.steps||{};const map=[null,'s1','s2','s3','s6','s7','s8'];return LABELS.map((t,i)=>{const done=i<idx||(map[i]&&s[map[i]]), now=i===idx;let when='';if(map[i]&&s[map[i]])when=new Date(s[map[i]]).toLocaleDateString('ko-KR',{month:'long',day:'numeric'});return `<div class="step ${done?'done':''} ${now?'now':''}"><span class="dot"></span><div><div class="title">${t}</div>${when?`<div class="when">${when}</div>`:''}</div></div>`}).join('')}
function letterText(d){return `${d.bride||'신부'} · ${d.groom||'신랑'} 두 분께\n\n두 분의 이야기를 처음 들었던 날부터 오늘에 이르기까지 여러 문장을 함께 쓰고 다듬었습니다.\n\n그렇게 준비한 문장들이 두 분의 하루 속에서 웃음이 되고, 한 장면의 기억이 되었기를 바랍니다.\n\n${d.archiveScene||'예식은 끝났지만 그날 나눈 마음은 두 분이 함께 살아갈 시간 속에서 오래 이어질 거예요.'}\n\n영애, 오래 사랑한다는 마음을 담아 두 분의 앞으로를 조용히 응원하겠습니다.\n\n${d.archiveClosing||'두 분의 오래 기억될 하루를 함께할 수 있어 기뻤습니다.'}\n\nEverafter · 永愛`}
function render(d){const st=state(d), after=(d.steps||{}).s8;document.title=`${d.bride||''} · ${d.groom||''} 두 분의 이야기`;
$('#app').innerHTML=`<div class="brand">Everafter</div><div class="subbrand">LETTER · STORY · MEMORY</div><section class="hero"><div class="code">영애 ${esc(d.code||'')}</div><h1>${esc(d.bride||'신부')} · ${esc(d.groom||'신랑')}<br>두 분의 이야기</h1><p>${esc(d.date||'')} 오래 기억될 하루를 함께 준비합니다.</p><div class="tulip">🌷</div></section><section class="card state"><div class="eyebrow">지금 이곳에 있습니다</div><h2>${esc(st.title)}</h2><p>${esc(st.msg)}</p><div class="next"><b>다음 장면</b>${esc(st.next)}</div></section><section class="card"><div class="eyebrow">OUR STORY JOURNEY</div><div class="timeline">${timeline(d,st.idx)}</div></section>${after?`<section class="card"><div class="eyebrow">EVERAFTER LETTER · 永愛</div>${d.archiveSentence?`<div class="quote">“${esc(d.archiveSentence)}”</div>`:''}<div class="letter">${esc(letterText(d))}</div></section><section class="card reply" id="reply"><div class="eyebrow">편지에 답하기</div><h2>두 분의 오늘도 들려주세요.</h2><p style="color:var(--ink2)">한 문장이어도 충분합니다.</p><label>오늘은 어떤 하루로 기억되나요?</label><div class="chips" id="chips">${['따뜻한 하루','웃음이 많았던 하루','편안했던 하루','우리다웠던 하루','오래 기억하고 싶은 하루'].map(x=>`<button type="button">${x}</button>`).join('')}</div><label>Everafter와 함께하며 가장 좋았던 순간</label><textarea id="best" placeholder="편하게 들려주세요."></textarea><label>Everafter에 남기고 싶은 한 문장</label><textarea id="sentence" placeholder="한 문장이어도 충분합니다."></textarea><label>남겨주신 문장의 소개 범위</label><select id="consent" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff"><option value="private">Everafter에게만 남길게요</option><option value="anonymous">이름을 가리고 소개해도 좋아요</option><option value="named">두 사람의 이름과 함께 소개해도 좋아요</option></select><button id="sendReply" style="margin-top:20px">편지 보내기</button></section>`:''}<div class="foot"><b>Everafter · 永愛</b><br>오래 기억될 하루를 함께 만듭니다.</div>`;
if(after){$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')e.target.classList.toggle('on')};$('#sendReply').onclick=()=>sendReply(d)} }
async function sendReply(d){const {gs}=gsFromHash();const tags=[...document.querySelectorAll('#chips .on')].map(x=>x.textContent);const body={type:'afterReview',id:d.id,review:{memoryTags:tags,bestMoment:$('#best').value.trim(),sentence:$('#sentence').value.trim(),publishConsent:$('#consent').value,submittedAt:new Date().toISOString()}};if(!body.review.bestMoment&&!body.review.sentence){alert('한 문장이라도 들려주세요.');return}const b=$('#sendReply');b.disabled=true;b.textContent='편지를 보내는 중입니다…';try{const r=await fetch(gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'전송 실패');$('#reply').innerHTML='<div class="eyebrow">THANK YOU</div><h2>두 분의 답장을 잘 받았습니다.</h2><p style="color:var(--ink2)">남겨주신 문장도 오래 간직하겠습니다.</p>'}catch(e){b.disabled=false;b.textContent='편지 보내기';alert('보내지 못했습니다. 잠시 뒤 다시 시도해 주세요.')}}
function lookup(){return `<div class="brand">Everafter</div><div class="subbrand">LETTER · STORY · MEMORY</div><section class="lookup"><h1>두 분의 이야기 찾기</h1><p>안내받은 영애 코드와 두 분 중 한 분의 이름을 입력해 주세요.</p><input id="code" placeholder="2608_01"><input id="name" placeholder="이름"><button id="find" style="margin-top:10px">두 분의 이야기 열기</button><div id="err" class="error"></div></section>`}
async function init(){const h=gsFromHash();if(!h.id){$('#app').innerHTML=lookup();$('#find').onclick=async()=>{const code=normalize($('#code').value),name=$('#name').value.trim();if(!code||!name){$('#err').textContent='코드와 이름을 확인해 주세요.';return}try{const r=await fetch(`${h.gs}?lookup=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`);const j=await r.json();if(!j.ok||!j.id)throw 0;location.hash=j.id}catch(e){$('#err').textContent='두 분의 이야기를 찾지 못했습니다.'}};return}$('#app').innerHTML='<section class="hero"><div class="tulip">🌷</div><p>두 분의 이야기를 여는 중입니다.</p></section>';try{const r=await fetch(`${h.gs}?journey=${encodeURIComponent(h.id)}`);const j=await r.json();if(!j.ok||!j.journey)throw new Error();render(j.journey)}catch(e){$('#app').innerHTML='<div class="error" style="margin-top:100px"><h2>이야기를 열지 못했습니다.</h2><p>받으신 링크를 다시 확인해 주세요.</p></div>'}}
init();
</script></body></html>
