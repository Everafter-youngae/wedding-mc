<meta name="theme-color" content="#F3F0EA">
<style>
:root{--paper:#F3F0EA;--card:#FFFEFB;--ink:#27231F;--ink2:#726A62;--line:#DED8CF;--wine:#8A2540;--wine2:#F4E7EB;--olive:#6F775D;--shadow:0 18px 50px rgba(48,39,31,.08);--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--serif:"Iowan Old Style","Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(82,65,48,.025) .6px,transparent .65px),radial-gradient(rgba(255,255,255,.32) .65px,transparent .7px);background-position:0 0,5px 5px;background-size:10px 10px;color:var(--ink);font-family:var(--sans);line-height:1.75;overflow-x:hidden}
.wrap{max-width:680px;margin:auto;padding:32px 18px 100px}.brand{text-align:center;font-family:var(--serif);font-size:18px;letter-spacing:.12em}.subbrand{text-align:center;color:var(--ink2);font-size:11px;letter-spacing:.18em;margin-top:2px}.hero{text-align:center;padding:70px 16px 46px}.code-label{font-size:10px;color:var(--ink2);letter-spacing:.16em;text-transform:uppercase}.code{display:inline-block;margin-top:7px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--wine);font-size:12px;letter-spacing:.08em}.hero h1{font-size:30px;line-height:1.45;letter-spacing:-.04em;margin:28px 0 14px}.hero p{color:var(--ink2);margin:0;word-break:keep-all}.tulip{font-size:34px;margin:28px 0 0;filter:saturate(.72)}
.card{background-color:var(--card);background-image:radial-gradient(rgba(90,72,53,.014) .5px,transparent .6px);background-size:8px 8px;border:1px solid var(--line);border-radius:18px;padding:26px 22px;margin:14px 0;box-shadow:var(--shadow)}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--wine);font-weight:700}.state h2{font-size:23px;letter-spacing:-.03em;margin:8px 0 12px}.state p{color:var(--ink2);margin:0}.next{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}.next b{display:block;color:var(--ink);margin-bottom:3px}
.timeline{padding:14px 0 4px}.step{display:grid;grid-template-columns:22px 1fr;gap:14px;position:relative;min-height:72px;padding:0 0 14px}.step:last-child{min-height:auto;padding-bottom:0}.step:not(:last-child):before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:1px;background:#E4DED5}.dot{width:13px;height:13px;margin-top:2px;border:1.5px solid #D9D2C8;border-radius:50%;background:var(--card);position:relative;z-index:1}.step.done .dot{width:9px;height:9px;margin:4px 0 0 2px;background:var(--olive);border-color:var(--olive)}.step.now .dot{background:var(--card);border:2px solid var(--wine);animation:current-breathe 2.8s ease-in-out infinite}.step.now .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(138,37,64,.28);animation:current-ripple 2.8s ease-out infinite}.step .title{font-size:16px;color:#827970;line-height:1.45;font-weight:400;word-break:keep-all}.step.done .title{color:#3F3A35}.step.now .title{color:var(--wine);font-size:17px;font-weight:600}.when{font-size:11px;color:#8C837A;margin-top:5px}.step.now .when{color:var(--wine);font-weight:600}@keyframes current-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 4px rgba(138,37,64,.08)}50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(138,37,64,.14)}}@keyframes current-ripple{0%{transform:scale(.82);opacity:0}25%{opacity:.65}70%,100%{transform:scale(1.2);opacity:0}}@media (prefers-reduced-motion:reduce){.step.now .dot,.step.now .dot::after{animation:none}}
.letter-head{font-size:18px;font-weight:500;margin:8px 0 30px;letter-spacing:-.02em}.letter{font-size:17px;line-height:2.05;white-space:pre-line;letter-spacing:-.015em;word-break:keep-all}.quote{font-size:19px;line-height:1.8;text-align:center;padding:18px 12px 28px;color:var(--wine);letter-spacing:-.02em;font-weight:500;word-break:keep-all}.letter-signature{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.4;margin-top:34px;text-align:right;color:var(--ink);letter-spacing:.035em}
button,.btn{display:block;width:100%;border:1px solid var(--wine);background:var(--wine);color:white;border-radius:12px;padding:15px 18px;font:700 15px var(--sans);text-align:center;text-decoration:none;cursor:pointer}.reply label{display:block;font-size:13px;color:var(--ink2);margin:18px 0 7px}.reply textarea,.reply input,.reply select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;font:15px var(--sans)}.reply textarea{min-height:110px;resize:vertical}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{width:auto;background:#fff;color:var(--ink2);border-color:var(--line);padding:10px 13px;font-weight:500}.chips button.on{background:var(--wine2);color:var(--wine);border-color:var(--wine)}.lookup{max-width:460px;margin:80px auto}.lookup h1{text-align:center;font-size:27px}.lookup p{text-align:center;color:var(--ink2)}.lookup input{width:100%;padding:15px;border:1px solid var(--line);border-radius:11px;margin:7px 0;background:#fff;font-size:16px}.error{text-align:center;color:var(--wine);padding:20px}.foot{text-align:right;color:var(--ink2);font-size:12px;margin-top:44px;padding-right:4px;line-height:1.8}.foot b{font-family:var(--serif);color:var(--ink);font-size:15px}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const GS_URL='https://script.google.com/macros/s/AKfycbyULnOlwGCrwEjeqgocZhZjh8pMazeaEvl8H78vd7RV61aX9HKq0a6tS_0KWZcf7Ufjhg/exec';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABELS=['처음 인사를 나누었어요','두 분의 이야기를 들었어요','첫 번째 대본을 보내드렸어요','이야기를 함께 다듬어요','마지막 문장을 준비해요','오래 기억될 그날을 기다려요','오늘의 기억을 남겨요'];
function normalize(v){const n=String(v||'').normalize('NFC').replace(/영애/gi,'').replace(/\D/g,'');return n.length===6?`${n.slice(0,4)}_${n.slice(4)}`:''}
function routeFromHash(){let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}const [key,dep]=h.split('~');return {key:key.trim(),gs:dep?`https://script.google.com/macros/s/${dep}/exec`:GS_URL}}
function state(d){const s=d.steps||{};if(s.s10||s.s9)return {idx:6,title:'오늘의 기억을 남겼어요',msg:'두 분의 하루를 한 편의 편지로 남겨두었습니다.',next:'언제든 이곳에서 그날의 문장을 다시 만나보세요.'};if(s.s8)return {idx:6,title:'Everafter 편지를 전합니다',msg:'오래 기억될 하루와 오래 이어질 사랑을 담아 편지를 준비했습니다.',next:'편지를 읽은 뒤, 두 분의 오늘도 한 문장으로 들려주세요.'};if(s.s7)return {idx:5,title:'그날을 기다리고 있어요',msg:'두 분의 이야기를 모두 준비했습니다.',next:'예식 당일, 이 문장으로 두 분을 소개하겠습니다.'};if(s.s6)return {idx:4,title:'마지막 대본이 준비되었어요',msg:'두 분의 이야기를 담은 마지막 대본을 보내드렸습니다.',next:'마지막으로 두 분의 마음을 확인해 주세요.'};if(s.s5)return {idx:4,title:'마지막 문장을 다듬고 있어요',msg:'두 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분의 마지막 대본을 준비해 보내드릴게요.'};if(s.s4)return {idx:3,title:'두 번째 대본이 준비되었어요',msg:'두 분과 나눈 이야기를 다시 담아 대본을 다듬었습니다.',next:'더하고 싶은 이야기나 덜어내고 싶은 부분을 들려주세요.'};if(s.s3)return {idx:3,title:'함께 다듬고 있어요',msg:'첫 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분다운 문장으로 다시 정리해 보내드릴게요.'};if(s.s2)return {idx:2,title:'첫 번째 대본을 보내드렸어요',msg:'두 분이 들려주신 이야기를 첫 번째 대본에 담았습니다.',next:'편하게 읽어보시고 두 분의 생각을 들려주세요.'};if(s.s1)return {idx:1,title:'두 분의 이야기를 기다리고 있어요',msg:'두 분다운 결혼식을 준비하기 위한 질문을 보내드렸습니다.',next:'한 문장이어도 충분합니다. 편하게 들려주세요.'};return {idx:0,title:'처음 인사를 나누었어요',msg:'두 분의 오래 기억될 하루를 함께 준비합니다.',next:'곧 두 분의 이야기를 들을 수 있는 질문을 보내드릴게요.'}}
function timeline(d,idx){const s=d.steps||{};const map=[null,'s1','s2','s3','s6','s7','s8'];return LABELS.map((t,i)=>{const done=i<idx||(map[i]&&s[map[i]]),now=i===idx;let when='';if(map[i]&&s[map[i]])when=new Date(s[map[i]]).toLocaleDateString('ko-KR',{month:'long',day:'numeric'});return `<div class="step ${done?'done':''} ${now?'now':''}"><span class="dot"></span><div><div class="title">${t}</div>${now?'<div class="when">지금 이곳에 있습니다</div>':(when?`<div class="when">${when}</div>`:'')}</div></div>`}).join('')}
function letterText(d){return `두 분의 이야기를 처음 들었던 날부터 오늘에 이르기까지 여러 문장을 함께 쓰고 다듬었습니다.\n\n그렇게 준비한 문장들이 두 분의 하루 속에서 웃음이 되고, 한 장면의 기억이 되었기를 바랍니다.\n\n${d.archiveScene||'예식은 끝났지만 그날 나눈 마음은 두 분이 함께 살아갈 시간 속에서 오래 이어질 거예요.'}\n\n영애, 오래 사랑한다는 마음을 담아 두 분의 앞으로를 조용히 응원하겠습니다.\n\n${d.archiveClosing||'두 분의 오래 기억될 하루를 함께할 수 있어 기뻤습니다.'}`}
function render(d){const st=state(d),after=Boolean((d.steps||{}).s8);document.title=`${d.bride||''} · ${d.groom||''} 두 분의 이야기`;const code=normalize(d.code||'')||String(d.code||'');
$('#app').innerHTML=`<div class="brand">Everafter</div><div class="subbrand">LETTER · STORY · MEMORY</div>
<section class="hero"><div class="code-label">Code</div><div class="code">영애 ${esc(code)}</div><h1>${esc(d.bride||'신부')} · ${esc(d.groom||'신랑')}<br>두 분의 이야기</h1><p>${esc(d.date||'')} 오래 기억될 하루를 함께 준비합니다.</p><div class="tulip">🌷</div></section>
<section class="card state"><div class="eyebrow">지금 이곳에 있습니다</div><h2>${esc(st.title)}</h2><p>${esc(st.msg)}</p><div class="next"><b>다음 장면</b>${esc(st.next)}</div></section>
<section class="card"><div class="eyebrow">OUR STORY JOURNEY</div><div class="timeline">${timeline(d,st.idx)}</div></section>
<section class="card letter-card"><div class="eyebrow">EVERAFTER LETTER · 永愛</div><div class="letter-head">${esc(d.bride||'신부')} · ${esc(d.groom||'신랑')} 두 분께</div>${d.archiveSentence?`<div class="quote">“${esc(d.archiveSentence)}”</div>`:''}<div class="letter">${esc(letterText(d))}</div><div class="letter-signature">Everafter · 永愛</div></section>
${after?`<section class="card reply" id="reply"><div class="eyebrow">편지에 답하기</div><h2>두 분의 오늘도 들려주세요.</h2><p style="color:var(--ink2)">한 문장이어도 충분합니다.</p><label>오늘은 어떤 하루로 기억되나요?</label><div class="chips" id="chips">${['따뜻한 하루','웃음이 많았던 하루','편안했던 하루','우리다웠던 하루','오래 기억하고 싶은 하루'].map(x=>`<button type="button">${x}</button>`).join('')}</div><label>Everafter와 함께하며 가장 좋았던 순간</label><textarea id="best" placeholder="편하게 들려주세요."></textarea><label>Everafter에 남기고 싶은 한 문장</label><textarea id="sentence" placeholder="한 문장이어도 충분합니다."></textarea><label>남겨주신 문장의 소개 범위</label><select id="consent"><option value="private">Everafter에게만 남길게요</option><option value="anonymous">이름을 가리고 소개해도 좋아요</option><option value="named">두 사람의 이름과 함께 소개해도 좋아요</option></select><button id="sendReply" style="margin-top:20px">편지 보내기</button></section>`:''}
<div class="foot"><b>Everafter · 永愛</b><br>오래 기억될 하루를 함께 만듭니다.</div>`;
if(after){const chosen=[];document.querySelectorAll('#chips button').forEach(btn=>btn.addEventListener('click',()=>{btn.classList.toggle('on');const i=chosen.indexOf(btn.textContent);if(i>-1)chosen.splice(i,1);else chosen.push(btn.textContent)}));$('#sendReply').addEventListener('click',async()=>{const payload={tags:chosen,best:$('#best').value.trim(),sentence:$('#sentence').value.trim(),consent:$('#consent').value};try{const route=routeFromHash();const r=await fetch(route.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'reply',id:d.id,data:payload})});const j=await r.json();if(!j.ok)throw new Error(j.error||'답장을 보내지 못했습니다.');$('#reply').innerHTML='<div class="eyebrow">편지에 답하기</div><h2>두 분의 이야기를 잘 받았습니다.</h2><p style="color:var(--ink2)">남겨주신 문장을 오래 간직하겠습니다.</p>'}catch(e){alert(e.message)}})} }
function lookup(){return `<div class="brand">Everafter</div><div class="subbrand">LETTER · STORY · MEMORY</div><section class="lookup"><h1>두 분의 이야기 찾기</h1><p>안내받은 영애 코드와 두 분 중 한 분의 이름을 입력해 주세요.</p><input id="code" placeholder="2608_01"><input id="name" placeholder="이름"><button id="find" style="margin-top:10px">두 분의 이야기 열기</button><div id="err" class="error"></div></section>`}
async function loadByRoute(route){const code=normalize(route.key);if(code){const r=await fetch(`${route.gs}?story=${encodeURIComponent(code)}`);return r.json()}const r=await fetch(`${route.gs}?journey=${encodeURIComponent(route.key)}`);return r.json()}
async function init(){const route=routeFromHash();if(!route.key){$('#app').innerHTML=lookup();$('#find').onclick=async()=>{const code=normalize($('#code').value),name=$('#name').value.trim();if(!code||!name){$('#err').textContent='코드와 이름을 확인해 주세요.';return}try{const r=await fetch(`${route.gs}?lookup=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`);const j=await r.json();if(!j.ok||!j.id)throw new Error();location.hash='영애'+code}catch(e){$('#err').textContent='두 분의 이야기를 찾지 못했습니다.'}};return}$('#app').innerHTML='<section class="hero"><div class="tulip">🌷</div><p>두 분의 이야기를 여는 중입니다.</p></section>';try{const j=await loadByRoute(route);if(!j.ok||!j.journey)throw new Error();render(j.journey)}catch(e){$('#app').innerHTML='<div class="error" style="margin-top:100px"><h2>이야기를 열지 못했습니다.</h2><p>받으신 링크를 다시 확인해 주세요.</p></div>'}}
init();
</script></body></html>
