<style>
/* BRAND.md v1.0 — Ivory 바탕 · Charcoal 글자 · Sky/Banana는 면으로.
   금색·serif·과한 카드/그림자는 쓰지 않습니다. */
:root{--ivory:#FFFDF5;--ivory-soft:#FFF8E4;--sky:#64AAC3;--sky-ink:#357289;--sky-deep:#2C5E70;--banana:#FFEBB0;--ink:#222222;--ink2:#5C5B55;--ink3:#87857D;--line:#E6E1D2;--card:#FFFFFF;--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
body{margin:0;background-color:var(--ivory);background-image:radial-gradient(rgba(34,34,34,.018) .6px,transparent .65px);background-size:9px 9px;color:var(--ink);font-family:var(--sans);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:auto;padding:34px 18px 110px}
.brand{text-align:center;font-size:25px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.subbrand{text-align:center;color:var(--ink2);font-size:10.5px;font-weight:700;letter-spacing:.42em;text-indent:.42em;margin-top:9px;text-transform:uppercase}
.hero{text-align:left;padding:56px 0 40px}
.code-label{font-size:10.5px;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.code{display:inline-block;margin-top:8px;padding:7px 15px;border:1px solid var(--sky);border-radius:999px;color:var(--sky-ink);font-size:13px;font-weight:700;letter-spacing:.06em}
.hero h1{font-size:clamp(31px,8.6vw,44px);line-height:1.24;letter-spacing:-.045em;font-weight:800;margin:26px 0 14px;word-break:keep-all}
.hero p{color:var(--ink2);margin:0;word-break:keep-all}
/* 카드 상자 대신 가는 선과 여백으로 나눕니다 */
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:34px 0 6px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--sky-ink);font-weight:800;text-transform:uppercase}
.card.state{background:var(--banana);border-top:0;border-radius:6px;padding:28px 24px 26px;margin:0 0 6px}
.card.state .eyebrow{color:var(--ink)}
.state h2{font-size:23px;letter-spacing:-.03em;margin:10px 0 12px;font-weight:800;word-break:keep-all}
.state p{color:var(--ink);margin:0;opacity:.78}
.next{margin-top:20px;padding-top:18px;border-top:1px solid rgba(34,34,34,.16);font-size:14px}
.next b{display:block;margin-bottom:3px}
.sc-sub{margin:16px 0 8px;font-size:14px;font-weight:700;color:var(--ink);word-break:keep-all}
.sc-sub.soft{margin-top:20px;color:var(--ink2);font-size:13px;font-weight:600}
ul.sc{list-style:none;margin:0;padding:0}
ul.sc li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14.5px;line-height:1.6;word-break:keep-all}
ul.sc li b{flex:none;min-width:66px;color:var(--sky-ink);font-weight:700;font-variant-numeric:tabular-nums}
ul.sc.soft li{font-size:13.5px;color:var(--ink2)}ul.sc.soft li b{color:var(--ink2);font-weight:600}
.sc-note{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.65;word-break:keep-all}
.timeline{padding:14px 0 4px}
.step{display:grid;grid-template-columns:22px 1fr;gap:14px;position:relative;min-height:72px;padding:0 0 14px}
.step:last-child{min-height:auto;padding-bottom:0}
.step:not(:last-child):before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:1px;background:var(--line)}
.dot{width:13px;height:13px;margin-top:2px;border:1.5px solid #D6D0BE;border-radius:50%;background:var(--ivory);position:relative;z-index:1}
.step.done .dot{width:9px;height:9px;margin:4px 0 0 2px;background:var(--sky);border-color:var(--sky)}
.step.now .dot{background:var(--ivory);border:2px solid var(--sky-ink);animation:current-breathe 2.8s ease-in-out infinite}
.step.now .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(53,114,137,.3);animation:current-ripple 2.8s ease-out infinite}
.step .title{font-size:16px;color:var(--ink3);line-height:1.45;font-weight:400;word-break:keep-all}
.step.done .title{color:var(--ink)}
.step.now .title{color:var(--sky-ink);font-size:17px;font-weight:700}
.when{font-size:12px;color:var(--ink3);margin-top:5px}
.step.now .when{color:var(--sky-ink);font-weight:600}
@keyframes current-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 4px rgba(53,114,137,.08)}50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(53,114,137,.14)}}
@keyframes current-ripple{0%{transform:scale(.82);opacity:0}25%{opacity:.65}70%,100%{transform:scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.step.now .dot,.step.now .dot::after{animation:none}}
/* 편지 — 이 화면의 주인공이라 유일하게 면을 씁니다 */
.letter-card{background:var(--ivory-soft);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:6px;padding:34px 26px 30px;margin:34px 0 0}
.letter-head{font-size:18px;font-weight:700;margin:10px 0 26px;letter-spacing:-.02em}
.letter{font-size:17px;line-height:2.05;white-space:pre-line;letter-spacing:-.015em;word-break:keep-all}
.quote{font-size:19px;line-height:1.95;text-align:left;padding:6px 0 26px;color:var(--sky-ink);letter-spacing:-.02em;font-weight:700;word-break:keep-all;white-space:pre-line}
.quote.long{font-size:17.5px;line-height:2.05;padding:6px 0 26px}
.letter-signature{font-size:12px;font-weight:800;line-height:1.4;margin-top:34px;text-align:right;color:var(--ink);letter-spacing:.2em;text-transform:uppercase}
button,.btn{display:block;width:100%;border:1px solid var(--sky);background:var(--sky);color:var(--ink);border-radius:8px;padding:15px 18px;font:800 15px var(--sans);text-align:center;text-decoration:none;cursor:pointer}
button:active,.btn:active{background:#589FB9;border-color:#589FB9}
.reply label{display:block;font-size:13px;color:var(--ink2);margin:18px 0 7px}
.reply textarea,.reply input,.reply select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:14px 13px;font:16px var(--sans);color:var(--ink)}
.reply textarea{min-height:110px;resize:vertical}
.reply textarea:focus,.reply input:focus,.reply select:focus{border-color:var(--sky-ink);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{width:auto;min-height:46px;background:var(--card);color:var(--ink2);border-color:var(--line);padding:12px 16px;font-weight:600}
.chips button.on{background:var(--banana);color:var(--ink);border-color:var(--ink)}
.lookup{max-width:460px;margin:80px auto}
.lookup h1{text-align:center;font-size:27px;font-weight:800;letter-spacing:-.035em}
.lookup p{text-align:center;color:var(--ink2);word-break:keep-all}
.lookup input{width:100%;padding:16px;min-height:52px;border:1px solid var(--line);border-radius:8px;margin:7px 0;background:var(--card);font-size:16px}
.lookup input:focus{border-color:var(--sky-ink);outline:none}
.error{text-align:center;color:var(--sky-deep);padding:20px}
.foot{text-align:right;color:var(--ink2);font-size:13px;margin-top:48px;padding-right:2px;line-height:1.8}
.foot b{display:block;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
</style>
<script data-goatcounter="https://everafter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body><main class="wrap" id="app"></main>
<script src="shared.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABELS=['처음 인사를 나누었어요','두 분의 이야기를 들었어요','첫 번째 대본을 보내드렸어요','이야기를 함께 다듬어요','마지막 문장을 준비해요','오래 기억될 그날을 기다려요','오늘의 기억을 남겨요'];
function normalize(v){const n=String(v||'').normalize('NFC').replace(/영애/gi,'').replace(/\D/g,'');return n.length===6?`${n.slice(0,4)}_${n.slice(4)}`:''}
function routeFromHash(){let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}const [head,dep]=h.split('~');const [key,t]=head.split('.');return {key:(key||'').trim(),t:(t||'').trim(),gs:dep?`https://script.google.com/macros/s/${dep}/exec`:GS_URL}}
function state(d){const s=d.steps||{};if(s.s10||s.s9)return {idx:6,title:'오늘의 기억을 남겼어요',msg:'두 분의 하루를 한 편의 편지로 남겨두었습니다.',next:'언제든 이곳에서 그날의 문장을 다시 만나보세요.'};if(s.s8)return {idx:6,title:'Everafter 편지를 전합니다',msg:'오래 기억될 하루와 오래 이어질 사랑을 담아 편지를 준비했습니다.',next:'편지를 읽은 뒤, 두 분의 오늘도 한 문장으로 들려주세요.'};if(s.s7)return {idx:5,title:'그날을 기다리고 있어요',msg:'두 분의 이야기를 모두 준비했습니다.',next:'예식 당일, 이 문장으로 두 분을 소개하겠습니다.'};if(s.s6)return {idx:4,title:'마지막 대본이 준비되었어요',msg:'두 분의 이야기를 담은 마지막 대본을 보내드렸습니다.',next:'마지막으로 두 분의 마음을 확인해 주세요.'};if(s.s5)return {idx:4,title:'마지막 문장을 다듬고 있어요',msg:'두 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분의 마지막 대본을 준비해 보내드릴게요.'};if(s.s4)return {idx:3,title:'두 번째 대본이 준비되었어요',msg:'두 분과 나눈 이야기를 다시 담아 대본을 다듬었습니다.',next:'더하고 싶은 이야기나 덜어내고 싶은 부분을 들려주세요.'};if(s.s3)return {idx:3,title:'함께 다듬고 있어요',msg:'첫 번째 대본에 남겨주신 이야기를 살펴보고 있습니다.',next:'두 분다운 문장으로 다시 정리해 보내드릴게요.'};if(s.s2)return {idx:2,title:'첫 번째 대본을 보내드렸어요',msg:'두 분이 들려주신 이야기를 첫 번째 대본에 담았습니다.',next:'편하게 읽어보시고 두 분의 생각을 들려주세요.'};if(s.s1)return {idx:1,title:'두 분의 이야기를 기다리고 있어요',msg:'두 분다운 결혼식을 준비하기 위한 질문을 보내드렸습니다.',next:'한 문장이어도 충분합니다. 편하게 들려주세요.'};return {idx:0,title:'처음 인사를 나누었어요',msg:'두 분의 오래 기억될 하루를 함께 준비합니다.',next:'곧 두 분의 이야기를 들을 수 있는 질문을 보내드릴게요.'}}
function timeline(d,idx){const s=d.steps||{},plan=d.plan||{};const map=[null,'s1','s2','s3','s6','s7','s8'];
return LABELS.map((t,i)=>{const k=map[i],done=i<idx||(k&&s[k]),now=i===idx;
let when='';if(k&&s[k])when=new Date(s[k]).toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
/* 지난 칸은 실제 진행한 날, 남은 칸은 예정일을 보여줍니다 (늦었다는 표시는 하지 않습니다) */
const p=k&&plan[k]?plan[k]:'';
const sub=now?`지금 이곳에 있습니다${p?` · ${esc(p)} 예정`:''}`:(when||(p?`${esc(p)} 예정`:''));
return `<div class="step ${done?'done':''} ${now?'now':''}"><span class="dot"></span><div><div class="title">${t}</div>${sub?`<div class="when">${sub}</div>`:''}</div></div>`}).join('')}
function mdKo(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'').trim());return m?`${+m[2]}월 ${+m[3]}일`:''}
function dateKo(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'').trim());return m?`${+m[1]}년 ${+m[2]}월 ${+m[3]}일`:String(v||'').trim()}
function letterText(d){if(String(d.archiveBody||'').trim())return String(d.archiveBody).trim();return `두 분의 이야기를 처음 들었던 날부터 오늘에 이르기까지 여러 문장을 함께 쓰고 다듬었습니다.\n\n그렇게 준비한 문장들이 두 분의 하루 속에서 웃음이 되고, 한 장면의 기억이 되었기를 바랍니다.\n\n${d.archiveScene||'예식은 끝났지만 그날 나눈 마음은 두 분이 함께 살아갈 시간 속에서 오래 이어질 거예요.'}\n\n영애, 오래 사랑한다는 마음을 담아 두 분의 앞으로를 조용히 응원하겠습니다.\n\n${d.archiveClosing||'두 분의 오래 기억될 하루를 함께할 수 있어 기뻤습니다.'}`}
function scriptOverviewHTML(script,d){
  if(!script||!(script.sections||[]).length) return '';
  const secs=script.sections;
  return `<section class="card"><div class="eyebrow">지금 대본${script.round?` · ${esc(script.round)}`:''}</div>
    <ol style="margin:14px 0 0;padding:0;list-style:none">${secs.map((s,i)=>
      `<li style="display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:12px;color:var(--ink2);flex:none;width:20px">${String(i+1).padStart(2,'0')}</span>
        <span style="flex:1;font-weight:600">${esc(s.title)}</span>
        ${s.music?`<span style="font-size:12px;color:var(--sky-ink);flex:none">♪ ${esc(s.music)}</span>`:''}
      </li>`).join('')}</ol>
    ${d.reviewLink?`<a href="${esc(d.reviewLink)}" class="btn" style="margin-top:18px">대본 자세히 보기 →</a>`:''}
  </section>`;
}
/* 대표 문장은 여러 문장이 이어져 오는 일이 많습니다. 줄을 나눠 적어주셨으면 그대로,
   한 줄로 길게 오면 문장 끝에서 나눠 읽기 쉽게 보여드립니다. */
function quoteText(t){
  const v=String(t||'').trim();
  if(!v) return '';
  if(v.indexOf('\n')>=0) return v.split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
  return v.length<40?v:v.replace(/([.!?])\s*(?=\S)/g,'$1\n');
}
function quoteHTML(t){
  const q=quoteText(t);
  if(!q) return '';
  return `<div class="quote${q.split('\n').length>2?' long':''}">“${esc(q)}”</div>`;
}
function sentenceSectionHTML(d){
  const picks=d.sentencePicks||[];
  if(!picks.length) return '';
  const cats=[];picks.forEach(p=>{if(cats.indexOf(p.category)<0)cats.push(p.category)});
  return `<section class="card"><div class="eyebrow">함께 전해드리는 문장</div>
    <p style="color:var(--ink2);margin:10px 0 4px">식전 · 식후에 사용할 수 있도록 골라드린 SNS 문장입니다. 원하는 문장을 복사해 편하게 사용해 주세요.</p>
    ${cats.map(cat=>`<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <div style="font-size:13px;font-weight:700;color:var(--sky-ink);margin-bottom:10px">${esc(cat)}</div>
      ${picks.map((p,i)=>p.category===cat?`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1;white-space:pre-line;font-size:14.5px;line-height:1.85">${esc(p.text)}</div>
        <button type="button" data-copy-sentence="${i}" style="width:auto;flex:none;padding:9px 14px;font-size:12.5px;background:var(--card);color:var(--sky-ink);border-color:var(--sky)">복사</button>
      </div>`:'').join('')}
    </div>`).join('')}
  </section>`;
}
/* 준비 일정 · 예식이 끝나면(s8) 의미가 없어 감춥니다 */
function schedSectionHTML(d){const rows=(d.sched||[]).filter(r=>r&&r.label);if(!rows.length)return'';
/* 같은 날에 걸린 항목은 날짜를 한 번만 쓰고 아래로 묶습니다 */
const byDate=rs=>rs.reduce((o,r)=>{const last=o[o.length-1];if(last&&last.label===r.label)last.ts.push(r.t);else o.push({label:r.label,ts:[r.t]});return o},[]);
const li=g=>`<li><b>${esc(g.label)}</b><span>${g.ts.map(t=>esc(t)).join('<br>')}</span></li>`;
const mine=byDate(rows.filter(r=>r.who==='couple')),ours=byDate(rows.filter(r=>r.who==='mc'));
return `<section class="card"><div class="eyebrow">앞으로의 준비 일정</div>${mine.length?`<p class="sc-sub">✨ 두 분이 정해주실 것</p><ul class="sc">${mine.map(li).join('')}</ul>`:''}${ours.length?`<p class="sc-sub soft">✍🏻 제가 준비하는 것</p><ul class="sc soft">${ours.map(li).join('')}</ul>`:''}<p class="sc-note">💌 일정은 조금 여유 있게 잡아두었습니다.<br>주례 · 축가 · 축사는 천천히 이야기 나누시고, 정해지는 대로 편하게 알려주세요.<br><br>두 분은 하나씩 준비해주시면, 나머지는 제가 함께 준비해가겠습니다.</p></section>`}
function render(d,script){const st=state(d),after=Boolean((d.steps||{}).s8);document.title=`${d.bride||''} · ${d.groom||''} 두 분의 이야기`;const code=normalize(d.code||'')||String(d.code||'');
$('#app').innerHTML=`<div class="brand">Everafter</div><div class="subbrand">Youngae</div>
<section class="hero"><div class="code-label">Code</div><div class="code">영애 ${esc(code)}</div><h1>${esc(d.bride||'신부')} · ${esc(d.groom||'신랑')}<br>두 분의 이야기</h1><p>${esc(dateKo(d.date))}${dateKo(d.date)?' · ':''}오래 기억될 하루를 함께 준비합니다.</p></section>
<section class="card state"><div class="eyebrow">지금 이곳에 있습니다</div><h2>${esc(st.title)}</h2><p>${esc(st.msg)}</p><div class="next"><b>다음 장면</b>${esc(st.next)}</div></section>
<section class="card"><div class="eyebrow">OUR STORY JOURNEY</div><div class="timeline">${timeline(d,st.idx)}</div></section>
${after?'':schedSectionHTML(d)}
${scriptOverviewHTML(script,d)}
${sentenceSectionHTML(d)}
${after?`<section class="card letter-card"><div class="eyebrow">EVERAFTER LETTER · 永愛</div><div class="letter-head">${esc(d.bride||'신부')} · ${esc(d.groom||'신랑')} 두 분께</div>${quoteHTML(d.archiveSentence)}<div class="letter">${esc(letterText(d))}</div><div class="letter-signature">Everafter · 永愛</div></section>`:''}
${after?`<section class="card reply" id="reply"><div class="eyebrow">편지에 답하기</div><h2>두 분의 ${esc(mdKo(d.date)||'그날')}도 들려주세요.</h2><p style="color:var(--ink2)">한 문장이어도 충분합니다.</p><label>그날은 어떤 하루로 기억되나요?</label><div class="chips" id="chips">${['따뜻한 하루','웃음이 많았던 하루','편안했던 하루','우리다웠던 하루','오래 기억하고 싶은 하루'].map(x=>`<button type="button">${x}</button>`).join('')}</div><label>Everafter와 함께하며 가장 좋았던 순간</label><textarea id="best" placeholder="편하게 들려주세요."></textarea><label>Everafter에 남기고 싶은 한 문장</label><textarea id="sentence" placeholder="한 문장이어도 충분합니다."></textarea><label>남겨주신 문장의 소개 범위</label><select id="consent"><option value="private">Everafter에게만 남길게요</option><option value="anonymous">이름을 가리고 소개해도 좋아요</option><option value="named">두 사람의 이름과 함께 소개해도 좋아요</option></select><button id="sendReply" style="margin-top:20px">편지 보내기</button></section>`:''}
<div class="foot"><b>Everafter · 永愛</b><br>오래 기억될 하루를 함께 만듭니다.</div>`;
document.querySelectorAll('[data-copy-sentence]').forEach(btn=>btn.addEventListener('click',async()=>{const idx=+btn.dataset.copySentence,text=((d.sentencePicks||[])[idx]||{}).text||'';if(!text)return;try{await navigator.clipboard.writeText(text);const orig=btn.textContent;btn.textContent='복사됨';setTimeout(()=>{btn.textContent=orig},1200)}catch(e){}}));
if(after){const chosen=[];document.querySelectorAll('#chips button').forEach(btn=>btn.addEventListener('click',()=>{btn.classList.toggle('on');const i=chosen.indexOf(btn.textContent);if(i>-1)chosen.splice(i,1);else chosen.push(btn.textContent)}));$('#sendReply').addEventListener('click',async()=>{const payload={memoryTags:chosen,bestMoment:$('#best').value.trim(),sentence:$('#sentence').value.trim(),publishConsent:$('#consent').value,submittedAt:new Date().toISOString()};try{const route=routeFromHash();const r=await fetch(route.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'afterReview',id:d.id,t:routeFromHash().t,review:payload})});const j=await r.json();if(!j.ok)throw new Error(j.error||'답장을 보내지 못했습니다.');$('#reply').innerHTML='<div class="eyebrow">편지에 답하기</div><h2>두 분의 이야기를 잘 받았습니다.</h2><p style="color:var(--ink2)">남겨주신 문장을 오래 간직하겠습니다.</p>'}catch(e){alert(e.message)}})} }
function lookup(){return `<div class="brand">Everafter</div><div class="subbrand">Youngae</div><section class="lookup"><h1>두 분의 이야기 찾기</h1><p>안내받은 영애 코드와 두 분 중 한 분의 이름을 입력해 주세요.</p><input id="code" placeholder="2608_01"><input id="name" placeholder="이름"><button id="find" style="margin-top:10px">두 분의 이야기 열기</button><div id="err" class="error"></div></section>`}
async function loadByRoute(route){const code=normalize(route.key);if(code){const r=await fetch(`${route.gs}?story=${encodeURIComponent(code)}&t=${encodeURIComponent(route.t)}`);return r.json()}const r=await fetch(`${route.gs}?journey=${encodeURIComponent(route.key)}&t=${encodeURIComponent(route.t)}`);return r.json()}
async function init(){const route=routeFromHash();if(!route.key){$('#app').innerHTML=lookup();$('#find').onclick=async()=>{const code=normalize($('#code').value),name=$('#name').value.trim();if(!code||!name){$('#err').textContent='코드와 이름을 확인해 주세요.';return}try{const r=await fetch(`${route.gs}?lookup=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`);const j=await r.json();if(!j.ok||!j.id)throw new Error();location.hash=encodeURIComponent('영애'+code)+(j.t?'.'+j.t:'')}catch(e){$('#err').textContent='두 분의 이야기를 찾지 못했습니다.'}};return}$('#app').innerHTML=loaderHTML('두 분의 이야기를 여는 중입니다.');try{const j=await loadByRoute(route);if(!j.ok||!j.journey)throw new Error();let script=null;if(j.journey.id){try{const rs=await fetch(`${route.gs}?script=${encodeURIComponent(j.journey.id)}&t=${encodeURIComponent(route.t)}`);const js=await rs.json();if(js.ok&&js.script&&(js.script.sections||[]).length)script=js.script}catch(e){}}render(j.journey,script)}catch(e){$('#app').innerHTML=noticeHTML('두 분의 이야기를 열지 못했어요','<span>받으신 주소가 중간에 잘렸을 수 있어요.</span><span>처음부터 끝까지 복사해 다시 열어보시거나, 안내받은 영애 코드로 찾아보실 수 있습니다.</span>','<div class="act"><a href="story.html">영애 코드로 찾기</a></div>')}}
init();
</script></body></html>
