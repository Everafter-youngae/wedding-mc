<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두 분의 대본을 함께 다듬습니다</title>
<meta name="theme-color" content="#F2EFE9">
<style>
:root{--paper:#F2EFE9;--card:#fff;--ink:#24221F;--ink2:#6C6861;--line:#DED8CE;--wine:#8A2540;--wine2:#F5E8EC;--olive:#78806A;--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}.wrap{max-width:720px;margin:auto;padding:0 16px 120px}.hero{text-align:center;padding:60px 12px 36px}.brand{font-family:var(--serif);font-weight:700;letter-spacing:.08em}.round{margin-top:18px;font-size:12px;letter-spacing:.12em;color:var(--wine);font-weight:700}.hero h1{font-size:28px;line-height:1.45;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--ink2);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:23px 20px;margin:14px 0}.secnum{font-size:11px;letter-spacing:.13em;color:var(--wine)}h2{font-size:20px;margin:5px 0 15px;letter-spacing:-.03em}.music{font-size:13px;color:var(--olive);margin-bottom:12px}.script{font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:keep-all;padding:15px 0;border-top:1px solid #EEEAE3;border-bottom:1px solid #EEEAE3}.choose{display:flex;gap:8px;margin-top:17px}.choose button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px;color:var(--ink2);font:600 14px var(--sans)}.choose button.on{border-color:var(--wine);background:var(--wine2);color:var(--wine)}textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;font:15px var(--sans)}textarea{min-height:95px;resize:vertical;margin-top:10px}.fixbox{display:none}.fixbox.on{display:block}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}.bottom .in{max-width:720px;margin:auto;display:flex;gap:10px;align-items:center}.count{flex:1;font-size:13px;color:var(--ink2)}.send{border:0;border-radius:10px;background:var(--wine);color:#fff;padding:15px 22px;font:700 15px var(--sans)}.send:disabled{opacity:.55}.done{text-align:center;padding:100px 20px}.done h1{font-size:26px}.done p{color:var(--ink2)}.error{text-align:center;padding:100px 20px;color:var(--wine)}.namebox{margin-top:18px}.free{margin-top:22px}.free label,.namebox label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px}
</style>
</head>
<body><main class="wrap" id="app"></main><div class="bottom" id="bottom" hidden><div class="in"><div class="count" id="count"></div><button class="send" id="send">의견 보내기</button></div></div>
<script>
const GS_URL='https://script.google.com/macros/s/AKfycbyULnOlwGCrwEjeqgocZhZjh8pMazeaEvl8H78vd7RV61aX9HKq0a6tS_0KWZcf7Ufjhg/exec';
const $=(s,r=document)=>r.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DOC=null,ANS={name:'',free:'',notes:{}};
function hashInfo(){let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}const [id,dep]=h.split('~');return{id,gs:dep?`https://script.google.com/macros/s/${dep}/exec`:GS_URL}}
function updateCount(){const vals=Object.values(ANS.notes),done=vals.filter(x=>x&&x.v).length;$('#count').textContent=`${done} / ${(DOC.sections||[]).length}개 확인`}
function render(){document.title=`${DOC.bride||''} · ${DOC.groom||''} 대본`;$('#app').innerHTML=`<section class="hero"><div class="brand">Everafter</div><div class="round">${esc(DOC.round||'대본')}</div><h1>${esc(DOC.bride||'신부')} · ${esc(DOC.groom||'신랑')}<br>두 분의 이야기를 함께 다듬습니다.</h1><p>그대로 좋은 문장과 조금 더 다듬고 싶은 부분을 알려주세요.</p><div class="namebox"><label>작성자 이름</label><input id="name" placeholder="신랑 또는 신부 이름"></div></section>${(DOC.sections||[]).map((s,i)=>`<section class="card" data-key="${esc(s.key)}"><div class="secnum">${String(i+1).padStart(2,'0')}</div><h2>${esc(s.title)}</h2>${s.music?`<div class="music">음악 · ${esc(s.music)}</div>`:''}<div class="script">${esc(s.text)}</div><div class="choose"><button type="button" data-v="ok">이대로 좋아요</button><button type="button" data-v="fix">고치고 싶어요</button></div><div class="fixbox"><textarea placeholder="더하고 싶은 이야기나 덜어내고 싶은 부분을 편하게 적어주세요."></textarea></div></section>`).join('')}<section class="card free"><label>마지막으로 남기고 싶은 말</label><textarea id="free" placeholder="한 문장이어도 충분합니다."></textarea></section>`;
document.querySelectorAll('.card[data-key]').forEach(card=>{const key=card.dataset.key;card.querySelectorAll('[data-v]').forEach(btn=>btn.onclick=()=>{const v=btn.dataset.v;card.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===btn));card.querySelector('.fixbox').classList.toggle('on',v==='fix');ANS.notes[key]=ANS.notes[key]||{};ANS.notes[key].v=v;if(v==='ok')ANS.notes[key].text='';updateCount()});card.querySelector('textarea').oninput=e=>{ANS.notes[key]=ANS.notes[key]||{v:'fix'};ANS.notes[key].text=e.target.value}});$('#bottom').hidden=false;updateCount()}
async function submit(){ANS.name=$('#name').value.trim();ANS.free=$('#free').value.trim();if(!ANS.name){alert('작성자 이름을 적어주세요.');$('#name').focus();return}const missing=(DOC.sections||[]).filter(s=>!ANS.notes[s.key]||!ANS.notes[s.key].v);if(missing.length){alert('모든 순서를 한 번씩 확인해 주세요.');return}const {id,gs}=hashInfo();const payload={type:'review',id,name:ANS.name,round:DOC.round||'',notes:ANS.notes,free:ANS.free,ts:new Date().toISOString()};const b=$('#send');b.disabled=true;b.textContent='보내는 중입니다…';try{const r=await fetch(gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const j=await r.json();if(!j.ok)throw new Error(j.error||'전송 실패');$('#bottom').hidden=true;$('#app').innerHTML='<div class="done"><div style="font-size:38px">🌷</div><h1>두 분의 이야기를 잘 받았습니다.</h1><p>남겨주신 마음을 살펴보고<br>다음 대본에 정성껏 담겠습니다.</p></div>'}catch(e){b.disabled=false;b.textContent='의견 보내기';alert('의견을 보내지 못했습니다. 잠시 뒤 다시 시도해 주세요.')}}
async function init(){const {id,gs}=hashInfo();if(!id){$('#app').innerHTML='<div class="error"><h2>링크를 확인해 주세요.</h2></div>';return}$('#app').innerHTML='<div class="done"><div style="font-size:38px">🌷</div><p>두 분의 대본을 여는 중입니다.</p></div>';try{const r=await fetch(`${gs}?script=${encodeURIComponent(id)}`);const j=await r.json();if(!j.ok||!j.script)throw 0;DOC=j.script;render();$('#send').onclick=submit}catch(e){$('#app').innerHTML='<div class="error"><h2>대본을 열지 못했습니다.</h2><p>받으신 링크를 다시 확인해 주세요.</p></div>'}}
init();
</script></body></html>
