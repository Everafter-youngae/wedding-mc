<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두 분의 대본을 함께 다듬습니다</title>
<meta name="theme-color" content="#F2EFE9">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Everafter">
<meta property="og:title" content="두 분의 이야기가 준비되었습니다">
<meta property="og:description" content="대본을 함께 다듬어가요. 편하게 둘러봐 주세요.">
<meta property="og:image" content="https://everafter-youngae.github.io/wedding-mc/og-review.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--paper:#F2EFE9;--card:#fff;--ink:#24221F;--ink2:#6C6861;--line:#DED8CE;--wine:#8A2540;--wine2:#F5E8EC;--olive:#78806A;--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}.wrap{max-width:720px;margin:auto;padding:0 16px 120px}.hero{text-align:center;padding:60px 12px 36px}.brand{font-family:var(--serif);font-weight:700;letter-spacing:.08em}.round{margin-top:18px;font-size:12px;letter-spacing:.12em;color:var(--wine);font-weight:700}.hero h1{font-size:28px;line-height:1.45;letter-spacing:-.04em;margin:12px 0}.hero p{color:var(--ink2);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:23px 20px;margin:14px 0}.secnum{font-size:11px;letter-spacing:.13em;color:var(--wine)}h2{font-size:20px;margin:5px 0 15px;letter-spacing:-.03em}.music{font-size:13px;color:var(--olive);margin-bottom:12px}.script{font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:keep-all;padding:15px 0;border-top:1px solid #EEEAE3;border-bottom:1px solid #EEEAE3}.choose{display:flex;gap:8px;margin-top:17px}.choose button{flex:1;min-height:52px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 10px;color:var(--ink2);font:600 15px var(--sans)}.choose button.on{border-color:var(--wine);background:var(--wine2);color:var(--wine)}textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:14px 13px;background:#fff;font:16px var(--sans)}textarea{min-height:95px;resize:vertical;margin-top:10px}.fixbox{display:none}.fixbox.on{display:block}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}.bottom .in{max-width:720px;margin:auto;display:flex;gap:10px;align-items:center}.count{flex:1;font-size:13px;color:var(--ink2)}.send{border:0;border-radius:10px;background:var(--wine);color:#fff;padding:15px 22px;font:700 15px var(--sans)}.send:disabled{opacity:.55}.done{text-align:center;padding:100px 20px}.done h1{font-size:26px}.done p{color:var(--ink2)}.error{text-align:center;padding:100px 20px;color:var(--wine)}.namebox{margin-top:18px}.free{margin-top:22px}.free label,.namebox label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px}
.script .brk{display:inline-block;width:1px;height:.9em;background:#B9B2A6;vertical-align:-.12em;margin:0 .38em}
.script .stage{display:inline-block;color:var(--wine);background:var(--wine2);border-radius:4px;padding:1px 7px;font-size:14px}
.legend{font-size:12px;color:var(--ink2);margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:1px;height:12px;background:#B9B2A6}
.legend em{font-style:normal;color:var(--wine);background:var(--wine2);border-radius:4px;padding:0 6px;font-size:11px}
.prog{position:fixed;top:0;left:0;right:0;height:3px;background:#E6E0D6;z-index:6}
.prog i{display:block;height:100%;background:var(--wine);width:0;transition:width .25s}
.load{text-align:center;padding:100px 20px}
.px{width:112px;height:auto}
.px .f1,.px .f2,.px .f3{opacity:0}
.px .f1{animation:pf1 1.26s steps(1) infinite}
.px .f2{animation:pf2 1.26s steps(1) infinite}
.px .f3{animation:pf3 1.26s steps(1) infinite}
@keyframes pf1{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes pf2{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes pf3{0%,65%{opacity:0}66%,100%{opacity:1}}
.load p{color:var(--ink2)}
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:16px 0 12px;display:flex;align-items:center;gap:10px}
.topbar .names{font-family:var(--serif);font-size:14px;letter-spacing:.04em}
.topbar .step{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.topbar .toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 12px var(--sans);color:var(--ink2);margin-left:auto;min-height:38px}
.deck{position:relative;padding:8px 0 6px}
.deck .peek{position:absolute;left:9px;right:9px;top:0;height:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;opacity:.6}
.deck .peek.b{left:18px;right:18px;top:-8px;opacity:.32}
.card.one{position:relative;margin:0;animation:cardin .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card.one{animation:none}}
.dots{display:flex;gap:5px;justify-content:center;padding:18px 0 0;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:#DBD4C9;display:block}
.dots i.on{background:var(--olive)}
.dots i.now{width:18px;border-radius:3px;background:var(--wine)}
.cardnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.cardnav .in{max-width:720px;margin:auto;display:flex;gap:10px;align-items:center}
.cardnav .prev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px 20px;min-height:52px;color:var(--ink2);font:500 15px var(--sans)}
.cardnav .next{flex:1;border:0;border-radius:10px;background:var(--wine);color:#fff;padding:15px;min-height:52px;font:700 15px var(--sans)}
</style>
</head>
<body><div class="prog"><i id="progBar"></i></div><main class="wrap" id="app"></main><div class="bottom" id="bottom" hidden><div class="in"><div class="count" id="count"></div><button class="send" id="send">의견 보내기</button></div></div>
<script src="shared.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scriptHTML(t){return esc(t).replace(/\(([^)]*)\)/g,'<span class="stage">($1)</span>').replace(/\s\/\s/g,'<span class="brk"></span>').replace(/『([^』]*)』/g,'<b>$1</b>');}
let DOC=null,ANS={name:'',free:'',notes:{}};let VIEW='card',IDX=-1;
function dkey(){return 'ea-review-'+(hashInfo().id||'x')}
function saveDraft(){try{localStorage.setItem(dkey(),JSON.stringify(ANS))}catch(e){}}
function loadDraft(){try{const v=localStorage.getItem(dkey());if(v)ANS=Object.assign(ANS,JSON.parse(v))}catch(e){}}
function hashInfo(){let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}const [id,dep]=h.split('~');return{id,gs:dep?`https://script.google.com/macros/s/${dep}/exec`:GS_URL}}
function updateCount(){const vals=Object.values(ANS.notes),done=vals.filter(x=>x&&x.v).length;const total=(DOC.sections||[]).length;
const pb=$('#progBar'); if(pb) pb.style.width=(total?done/total*100:0)+'%';
$('#count').textContent=`${done} / ${total}개 확인 · 중간에 닫으셔도 저장됩니다`}
function secCard(s,i,one){
  const n=(ANS.notes[s.key]||{});
  return `<section class="card ${one?'one':''}" data-key="${esc(s.key)}"><div class="secnum">${String(i+1).padStart(2,'0')}</div><h2>${esc(s.title)}</h2>${s.music?`<div class="music">음악 · ${esc(s.music)}</div>`:''}<div class="script">${scriptHTML(s.text)}</div><div class="choose"><button type="button" data-v="ok" class="${n.v==='ok'?'on':''}">이대로 좋아요</button><button type="button" data-v="fix" class="${n.v==='fix'?'on':''}">고치고 싶어요</button></div><div class="fixbox ${n.v==='fix'?'on':''}"><textarea placeholder="더하고 싶은 이야기나 덜어내고 싶은 부분을 편하게 적어주세요.">${esc(n.text||'')}</textarea></div></section>`;
}
function bindCards(){
  document.querySelectorAll('.card[data-key]').forEach(card=>{
    const key=card.dataset.key;
    card.querySelectorAll('[data-v]').forEach(btn=>btn.onclick=()=>{
      const v=btn.dataset.v;
      card.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===btn));
      card.querySelector('.fixbox').classList.toggle('on',v==='fix');
      ANS.notes[key]=ANS.notes[key]||{};ANS.notes[key].v=v;
      if(v==='ok')ANS.notes[key].text='';
      saveDraft();updateCount();
      if(VIEW==='card'){const d=$('#dots');if(d)d.innerHTML=dotsHTML()}
    });
    card.querySelector('textarea').oninput=e=>{ANS.notes[key]=ANS.notes[key]||{v:'fix'};ANS.notes[key].text=e.target.value;saveDraft()};
  });
}
function dotsHTML(){
  return (DOC.sections||[]).map((s,i)=>{
    const done=(ANS.notes[s.key]||{}).v;
    return `<i class="${i===IDX?'now':(done?'on':'')}"></i>`;
  }).join('');
}
function topbar(){
  const n=(DOC.sections||[]).length+2;
  return `<div class="topbar"><span class="names">${esc(DOC.bride||'신부')} · ${esc(DOC.groom||'신랑')}</span>${VIEW==='card'?`<span class="step">${Math.min(IDX+2,n)} / ${n}</span>`:''}<button class="toggle" id="vToggle">${VIEW==='card'?'전체 보기':'한 장씩 보기'}</button></div>`;
}
function paint(){ VIEW==='card'?renderCard():renderList(); updateCount(); }

function overviewHTML(){
  const secs=DOC.sections||[];
  return `<section class="card one"><div class="secnum">식순</div><h2>전체 순서를 확인해 주세요</h2>
    <p style="color:var(--ink2);margin:0 0 6px">두 분이 정하신 순서 그대로입니다. 다음부터 하나씩 넘기면서 문장도 확인해 주세요.</p>
    <ol style="margin:16px 0 0;padding:0;list-style:none">${secs.map((s,i)=>
      `<li style="display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid #EEEAE3">
        <span style="font-size:12px;color:var(--ink3);flex:none;width:20px">${String(i+1).padStart(2,'0')}</span>
        <span style="flex:1;font-weight:600">${esc(s.title)}</span>
        ${s.music?`<span style="font-size:12px;color:var(--olive);flex:none">♪ ${esc(s.music)}</span>`:''}
      </li>`).join('')}</ol>
  </section>`;
}
function renderCard(){
  const secs=DOC.sections||[];
  IDX=Math.max(-1,Math.min(IDX,secs.length));
  $('#bottom').hidden=true;
  if(IDX===-1){
    $('#app').innerHTML=`${topbar()}<div class="deck">${overviewHTML()}</div><div class="dots" id="dots">${dotsHTML()}</div><div class="cardnav"><div class="in"><button class="next" id="cNext">순서대로 확인하기</button></div></div>`;
    $('#cNext').onclick=()=>{IDX=0;paint();window.scrollTo(0,0)};
  }else if(IDX===secs.length){
    $('#app').innerHTML=`${topbar()}<div class="deck"><section class="card one"><div class="secnum">마지막 장</div><h2>다 읽어주셔서 감사합니다</h2><p style="color:var(--ink2);margin:0 0 6px">남겨주신 마음을 살펴보고 다음 대본에 담겠습니다.</p><div class="namebox"><label>작성자 이름</label><input id="name" value="${esc(ANS.name||'')}" placeholder="신랑 또는 신부 이름"></div><div class="free"><label>마지막으로 남기고 싶은 말</label><textarea id="free" placeholder="한 문장이어도 충분합니다.">${esc(ANS.free||'')}</textarea></div></section></div><div class="dots" id="dots">${dotsHTML()}</div><div class="cardnav"><div class="in"><button class="prev" id="cPrev">이전</button><button class="next" id="cSend">의견 보내기</button></div></div>`;
    $('#name').oninput=e=>{ANS.name=e.target.value;saveDraft()};
    $('#free').oninput=e=>{ANS.free=e.target.value;saveDraft()};
    $('#cSend').onclick=submit;
  }else{
    const s=secs[IDX];
    $('#app').innerHTML=`${topbar()}<div class="deck"><div class="peek b"></div><div class="peek"></div>${secCard(s,IDX,true)}</div><div class="dots" id="dots">${dotsHTML()}</div><div class="cardnav"><div class="in"><button class="prev" id="cPrev">이전</button><button class="next" id="cNext">${IDX===secs.length-1?'마무리하기':'다음 장 열기'}</button></div></div>`;
    bindCards();
    $('#cNext').onclick=()=>{IDX++;paint();window.scrollTo(0,0)};
  }
  const pv=$('#cPrev'); if(pv) pv.onclick=()=>{IDX--;paint();window.scrollTo(0,0)};
  const tg=$('#vToggle'); if(tg) tg.onclick=()=>{VIEW='list';paint();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}

function renderList(){
  $('#app').innerHTML=`${topbar()}<section class="hero"><div class="brand">Everafter</div><div class="round">${esc(DOC.round||'대본')}</div><h1>${esc(DOC.bride||'신부')} · ${esc(DOC.groom||'신랑')}<br>두 분의 이야기를 함께 다듬습니다.</h1><p>그대로 좋은 문장과 조금 더 다듬고 싶은 부분을 알려주세요.</p><div class="legend"><span><i></i> 숨을 고르는 지점</span><span><em>( )</em> 읽지 않는 진행 안내</span></div><div class="namebox"><label>작성자 이름</label><input id="name" value="${esc(ANS.name||'')}" placeholder="신랑 또는 신부 이름"></div></section>${(DOC.sections||[]).map((s,i)=>secCard(s,i,false)).join('')}<section class="card free"><label>마지막으로 남기고 싶은 말</label><textarea id="free" placeholder="한 문장이어도 충분합니다.">${esc(ANS.free||'')}</textarea></section>`;
  bindCards();
  $('#name').oninput=e=>{ANS.name=e.target.value;saveDraft()};
  $('#free').oninput=e=>{ANS.free=e.target.value;saveDraft()};
  $('#vToggle').onclick=()=>{VIEW='card';IDX=-1;paint();window.scrollTo(0,0)};
  $('#bottom').hidden=false;
  $('#send').onclick=submit;
}

function render(){
  document.title=`${DOC.bride||''} · ${DOC.groom||''} 대본`;
  $('#app').innerHTML=`<section class="hero"><div class="brand">Everafter</div><div class="round">${esc(DOC.round||'대본')}</div><h1>${esc(DOC.bride||'신부')} · ${esc(DOC.groom||'신랑')}<br>두 분의 이야기를<br>함께 다듬습니다.</h1><p>순서를 한 장씩 보여드릴게요.<br>그대로 좋은 문장과 다듬고 싶은 부분을 알려주세요.</p><div class="legend"><span><i></i> 숨을 고르는 지점</span><span><em>( )</em> 읽지 않는 진행 안내</span></div><p style="margin-top:34px"><button class="next" style="max-width:220px;margin:auto;border:0;border-radius:999px;background:var(--wine);color:#fff;padding:16px 40px;font:700 15px var(--sans)" id="goRead">시작</button></p></section>`;
  $('#goRead').onclick=()=>{VIEW='card';IDX=-1;paint();window.scrollTo(0,0)};
}
async function submit(){if($('#name'))ANS.name=$('#name').value.trim();if($('#free'))ANS.free=$('#free').value.trim();if(!ANS.name)ANS.name='신랑신부';const missing=(DOC.sections||[]).filter(s=>!ANS.notes[s.key]||!ANS.notes[s.key].v);if(missing.length&&!confirm(`아직 확인하지 않은 순서가 ${missing.length}개 있습니다.\n지금 보내시고 나중에 이어서 보내셔도 괜찮습니다.\n\n이대로 보낼까요?`))return;const {id,gs}=hashInfo();const payload={type:'review',id,name:ANS.name,round:DOC.round||'',notes:ANS.notes,free:ANS.free,ts:new Date().toISOString()};const b=$('#cSend')||$('#send');if(b){b.disabled=true;b.textContent='보내는 중입니다…'}try{const r=await fetch(gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const j=await r.json();if(!j.ok)throw new Error(j.error||'전송 실패');try{localStorage.removeItem(dkey())}catch(e){}$('#bottom').hidden=true;const nv=document.querySelector('.cardnav');if(nv)nv.remove();$('#app').innerHTML='<div class="done"><div style="font-size:38px">🌷</div><h1>두 분의 이야기를 잘 받았습니다.</h1><p>남겨주신 마음을 살펴보고<br>다음 대본에 정성껏 담겠습니다.</p></div>'}catch(e){if(b){b.disabled=false;b.textContent='의견 보내기'}alert('의견을 보내지 못했습니다. 잠시 뒤 다시 시도해 주세요.')}}
async function init(){const {id,gs}=hashInfo();if(!id){$('#app').innerHTML='<div class="error"><h2>링크를 확인해 주세요.</h2></div>';return}$('#app').innerHTML='<div class="load"><svg class="px" viewBox="0 0 108 78" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true"><g class="f1"><rect x="48" y="18" width="18" height="6" fill="#8A2540"/><rect x="42" y="24" width="6" height="6" fill="#8A2540"/><rect x="48" y="24" width="6" height="6" fill="#D68CA0"/><rect x="54" y="24" width="6" height="6" fill="#8A2540"/><rect x="60" y="24" width="6" height="6" fill="#D68CA0"/><rect x="66" y="24" width="6" height="6" fill="#8A2540"/><rect x="42" y="30" width="30" height="6" fill="#8A2540"/><rect x="42" y="36" width="30" height="6" fill="#8A2540"/><rect x="48" y="42" width="18" height="6" fill="#8A2540"/><rect x="54" y="48" width="6" height="6" fill="#7A9A6B"/><rect x="48" y="54" width="12" height="6" fill="#7A9A6B"/><rect x="54" y="60" width="12" height="6" fill="#7A9A6B"/><rect x="54" y="66" width="6" height="6" fill="#7A9A6B"/></g><g class="f2"><rect x="48" y="18" width="18" height="6" fill="#8A2540"/><rect x="12" y="24" width="18" height="6" fill="#8A2540"/><rect x="42" y="24" width="6" height="6" fill="#8A2540"/><rect x="48" y="24" width="6" height="6" fill="#D68CA0"/><rect x="54" y="24" width="6" height="6" fill="#8A2540"/><rect x="60" y="24" width="6" height="6" fill="#D68CA0"/><rect x="66" y="24" width="6" height="6" fill="#8A2540"/><rect x="6" y="30" width="6" height="6" fill="#8A2540"/><rect x="12" y="30" width="6" height="6" fill="#D68CA0"/><rect x="18" y="30" width="6" height="6" fill="#8A2540"/><rect x="24" y="30" width="6" height="6" fill="#D68CA0"/><rect x="30" y="30" width="6" height="6" fill="#8A2540"/><rect x="42" y="30" width="30" height="6" fill="#8A2540"/><rect x="6" y="36" width="30" height="6" fill="#8A2540"/><rect x="42" y="36" width="30" height="6" fill="#8A2540"/><rect x="6" y="42" width="30" height="6" fill="#8A2540"/><rect x="48" y="
