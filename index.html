<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everafter · 사회자 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EDEFF2;
  --card:#FFFFFF;
  --ink:#15171C;
  --ink2:#5C636D;
  --ink3:#8A919B;
  --line:#DCE0E6;
  --line2:#EDF0F3;
  --wine:#8A2540;
  --wine-soft:#F6E9ED;
  --gold:#A9863A;
  --radius:10px;
  --sans:"Noto Sans KR","Noto Sans",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Sans KR","Noto Sans",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

/* ---------- 저장 실패 배너 ---------- */
.savebar{
  background:var(--wine);color:#fff;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;font-size:14px;line-height:1.5;
}
.savebar b{font-weight:700}
.savebar button{
  border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;
  border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;min-height:36px;margin-left:auto;white-space:nowrap;
}
.savebar button:hover{background:rgba(255,255,255,.24)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap;
}
.tb-group{display:flex;align-items:center;gap:8px}
.tb-div{width:1px;height:24px;background:var(--line);margin:0 4px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.03em}
.brand span{font-size:12px;color:var(--ink3);letter-spacing:.12em}
.btn{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink);min-height:40px;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.primary:hover{background:#711e35}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.quiet{border-color:transparent;color:var(--ink3);padding:9px 10px}
.btn.quiet:hover{background:var(--line2);color:var(--wine)}
.btn.ghost:hover{background:var(--line2)}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;font-size:14px;max-width:240px;min-height:40px}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:0;align-items:start}
.pane-l{
  border-right:1px solid var(--line);background:var(--card);
  height:calc(100vh - 53px);overflow-y:auto;position:sticky;top:53px;padding:0 0 80px;
}
.pane-r{padding:26px 26px 90px;min-width:0}

/* ---------- form ---------- */
.flow{padding:14px 16px;border-bottom:1px solid var(--line);background:#FAFBFC}
.flow h4{font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:600;margin:0 0 12px}
.fstep{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer}
.fstep .mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;margin-top:2px}
.fstep.done .mark{background:var(--wine);border-color:var(--wine);color:#fff}
.fstep.now .mark{border-color:var(--wine);box-shadow:0 0 0 3px var(--wine-soft)}
.fstep .t{flex:1;font-size:13.5px;color:var(--ink2);line-height:1.4}
.fstep.done .t{color:var(--ink)}
.fstep.now .t{color:var(--wine);font-weight:700}
.fstep .when{font-size:11px;color:var(--ink3);margin-top:2px;display:block}
.fstep .when.plan{color:var(--ink3)}
.fstep.now .when.plan{color:var(--wine);font-weight:600}
.flow .next{margin-top:12px;font-size:12px;color:var(--wine);background:var(--wine-soft);border-radius:6px;padding:9px 11px;line-height:1.5}
.group{border-bottom:1px solid var(--line2)}
.group>summary{
  list-style:none;cursor:pointer;padding:16px;display:flex;align-items:center;gap:8px;
  font-weight:600;font-size:15px;user-select:none;
}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{
  content:"";width:6px;height:6px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);
  transform:rotate(-45deg);transition:transform .15s;margin-left:1px;
}
.group[open]>summary::before{transform:rotate(45deg)}
.group>summary:hover{background:var(--line2)}
.gbody{padding:0 16px 20px}
.f{margin-bottom:16px}
.f>label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.f input[type=text],.f input[type=date],.f input[type=time],.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;font-size:15px;
}
.f textarea{resize:vertical;min-height:66px;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--wine);outline:none}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.hint{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5}
.linklike{border:0;background:none;padding:0;font:inherit;color:var(--ink3);text-decoration:underline;cursor:pointer}
.sched-row .who{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:100px;font-size:10.5px;font-weight:700;vertical-align:middle}
.sched-row .who.couple{background:var(--wine-soft);color:var(--wine)}
.sched-row .who.mc{background:#EDF0F3;color:var(--ink2)}
.sched-when{max-width:130px;flex:none}
.sched-label{font-size:13px;color:var(--ink2);padding:9px 0}
.linklike:hover{color:var(--wine)}
.retain-warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px;padding:14px 16px;
  border:1px solid var(--wine);border-radius:10px;background:var(--wine-soft);font-size:13px;line-height:1.55;word-break:keep-all}
.retain-warn b{color:var(--wine);flex:none}
.retain-warn span{color:var(--ink2);flex:1;min-width:200px}
.retain-warn .btn{flex:none}
.check{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0;cursor:pointer;min-height:40px}
.check input{width:15px;height:15px;accent-color:var(--wine);margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:11px 8px;font-size:14px;line-height:1.35;color:var(--ink2);border-left:1px solid var(--line);word-break:keep-all;min-height:44px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--wine-soft);color:var(--wine);font-weight:600}
.toggle-order{padding:6px 0}
.ord{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line2)}
.ord:last-child{border-bottom:0}
.ord input{accent-color:var(--wine);width:15px;height:15px}
.ord .n{font-size:12px;color:var(--ink3);width:18px;font-variant-numeric:tabular-nums}
.ord .t{flex:1}
.ord button.t{text-align:left;border:0;background:transparent;padding:4px 0;font-size:14px;color:var(--ink);border-bottom:1px dashed transparent}
.ord button.t:hover{color:var(--wine);border-bottom-color:var(--wine)}
.ord .m{font-size:12px;color:var(--ink3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-head{
  padding:20px 16px 8px;font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:600;
  border-top:1px solid var(--line);background:#FAFBFC;
}
.group.sec>summary{padding-left:16px;font-weight:500}
.group.sec>summary .sn{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:17px}
.group.sec>summary .st{flex:1}
.group.sec>summary .off{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.group.sec.is-off>summary .st{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.group.sec.is-off .gbody{opacity:.5}
:target>summary,.group.flash>summary{background:var(--wine-soft)}

/* ---------- preview ---------- */
.sheet{max-width:860px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sheet-head{padding:32px;border-bottom:2px solid var(--ink)}
.sheet-head .dt{font-size:12px;letter-spacing:.12em;color:var(--ink2)}
.sheet-head h1{font-family:var(--serif);font-size:30px;margin:8px 0 0;font-weight:900;letter-spacing:-.04em}
.sheet-head h1 .heart{color:var(--wine);font-size:22px;vertical-align:2px;margin:0 8px}
.sheet-head .sub{margin-top:12px;font-size:14px;color:var(--ink2)}
.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:600}

.pgm{padding:24px 32px;border-bottom:1px solid var(--line)}
.pgm h2,.blk h2{font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:600;margin:0 0 16px}
table.pgm-t{width:100%;border-collapse:collapse;font-size:14px}
table.pgm-t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.pgm-t td.i{width:28px;color:var(--ink3);font-variant-numeric:tabular-nums}
table.pgm-t td.t{width:38%;font-weight:500}
table.pgm-t td.n{color:var(--ink2);font-size:14px}

.blk{display:grid;grid-template-columns:170px 1fr;gap:0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .cue{padding:24px 16px 24px 32px;background:#FAFBFC;border-right:1px solid var(--line2)}
.blk .cue .num{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.blk .cue .ttl{font-family:var(--serif);font-size:16px;font-weight:700;margin-top:5px;line-height:1.3;letter-spacing:-.02em}
.blk .cue .tag{display:inline-block;margin-top:12px;font-size:12px;color:var(--wine);background:var(--wine-soft);border-radius:4px;padding:3px 8px}
.blk .cue .memo{margin-top:12px;font-size:12px;color:var(--ink2);white-space:pre-wrap;line-height:1.5}
.blk .cue .time{margin-top:12px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.blk .body{padding:24px 32px 24px 24px;min-width:0}
.script{font-size:16px;line-height:2.0;white-space:pre-wrap;word-break:keep-all}
.script .brk{
  display:inline-block;width:1px;height:.9em;background:var(--ink3);opacity:.55;
  vertical-align:-.12em;margin:0 .38em;
}
.script .stage{color:var(--wine);font-size:14px;background:var(--wine-soft);border-radius:3px;padding:1px 5px}
.script .kw{font-weight:700}
/* 대본 한 줄. 무대 모드(.sm-body .inner)도 같은 scriptHTML 을 쓰므로 범위를 좁히지 않습니다 */
.ln{display:block}
.ln:empty{height:1em}
.blk .tools{margin-top:12px;display:flex;gap:6px;opacity:0;transition:opacity .12s}
.blk:hover .tools,.blk:focus-within .tools{opacity:1}
.tools button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;color:var(--ink2)}
.tools button:hover{border-color:var(--ink3);color:var(--ink)}
textarea.edit{width:100%;border:1px solid var(--wine);border-radius:8px;padding:14px;font-size:15px;line-height:1.95;min-height:180px;resize:vertical}
.edited-flag{color:var(--wine);font-size:12px;margin-left:8px}

.empty{padding:60px 20px;text-align:center;color:var(--ink3)}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:99;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- stage mode ---------- */
/* touch-action:pan-y — 위아래로 넘기는 것만 두고 두 손가락 확대·두 번 톡 확대를 막습니다.
   (iOS 의 확대 제스처는 script 쪽 stageOn 에서 따로 막습니다) */
.stagemode{position:fixed;inset:0;background:#0F1115;color:#F2F3F5;z-index:100;display:none;flex-direction:column;touch-action:pan-y}
.stagemode.on{display:flex}
.sm-top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #262A33;flex-wrap:wrap}
.sm-top .step{font-size:12px;color:#8D95A3;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.sm-top .ttl{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:-.02em}
.sm-top .cue{font-size:12px;color:#C9A45C;margin-left:auto;text-align:right;white-space:pre-wrap;max-width:46%}
.sm-body{flex:1;overflow-y:auto;padding:34px 24px 120px}
.sm-body .inner{max-width:760px;margin:0 auto;font-size:27px;line-height:1.95;white-space:pre-wrap;word-break:keep-all;font-weight:500}
.sm-body .brk{display:inline-block;width:2px;height:.8em;background:#C9A45C;opacity:.55;vertical-align:-.05em;margin:0 .34em}
.sm-body .stage{display:inline-block;color:#C9A45C;font-size:20px;border:1px solid #3A3524;background:#1A1A14;border-radius:6px;padding:2px 10px}
.sm-nav{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;padding:14px 20px;background:linear-gradient(to top,#0F1115 60%,transparent)}
.sm-nav button{flex:1;background:#1B1F27;border:1px solid #2C3240;color:#F2F3F5;border-radius:9px;padding:14px;font-size:15px;font-weight:600}
.sm-nav button:active{background:#262C38}
.sm-nav .x{flex:0 0 auto;background:transparent;border-color:transparent;color:#8D95A3;font-weight:400}
.sm-prog{height:2px;background:#262A33}
.sm-prog i{display:block;height:100%;background:var(--gold);transition:width .2s}

/* ---------- 대시보드 ---------- */
/* 주의: display는 여기서 지정하지 않습니다 · 보이기/숨기기는 JS 인라인 style로만 제어
   (hidden 속성이 클래스 규칙에 밀리는 사고가 한 번 있었어서, 아예 겹치지 않게 함) */
.dashboard{max-width:1560px;margin:0 auto;padding:22px 36px}
.dash-title{font-family:var(--serif);font-size:20px;margin:0 0 14px;letter-spacing:-.02em}
.dash-inquiry-banner{display:block;width:100%;max-width:720px;text-align:left;margin:0 0 16px;padding:14px 18px;border-radius:12px;border:1px solid var(--wine);background:var(--wine-soft);color:var(--wine);font-weight:700;font-size:14px;cursor:pointer}
.dash-inquiry-banner:hover{background:var(--wine);color:#fff}
.dash-inquiry-banner.sync{border-color:var(--gold);background:#FBF6EA;color:#8A6D1F}
.dash-inquiry-banner.sync:hover{background:var(--gold);color:#fff}
.dash-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));justify-content:start;gap:10px;margin-bottom:22px}
.dash-quick .qbtn{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;min-height:auto;text-align:left}
.dash-quick .qbtn:hover{border-color:var(--ink3)}
.dash-quick .qbtn .ic{font-size:19px;line-height:1}
.dash-quick .qbtn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.dash-body{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;align-items:start}
.dash-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.dash-cal-head h2{font-size:15px;margin:0;letter-spacing:-.02em;font-weight:700}
.dash-cal-head .btn{padding:6px 11px;font-size:12.5px;min-height:32px}
.dash-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dash-grid.dow{margin-bottom:6px;text-align:center;font-size:11px;color:var(--ink3);font-weight:600}
.dcell{border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:52px;padding:5px;display:flex;flex-direction:column;gap:2px}
.dcell.empty{border-color:transparent;background:transparent}
.dcell.has{cursor:pointer;border-color:var(--wine);background:var(--wine-soft)}
.dcell.has:hover{filter:brightness(.97)}
.dcell.today .dnum{color:var(--wine);font-weight:700}
.dnum{font-size:11px;color:var(--ink3)}
.dwed{font-size:10px;color:var(--wine);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-list h3,.dash-memo h3{font-size:13px;margin:0 0 10px;letter-spacing:-.01em;color:var(--ink2);font-weight:700}
.dash-row{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:11px 14px;background:var(--card);margin-bottom:8px;font-size:13.5px}
.dash-row b{color:var(--wine);font-weight:700;min-width:72px;flex:none}
.dash-memo{margin-top:22px}
.dash-memo textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;line-height:1.65;resize:vertical;background:var(--card);font-family:inherit}
.dash-memo textarea:focus{border-color:var(--wine);outline:none}
@media (max-width:860px){
  .dash-body{grid-template-columns:1fr}
  .dash-memo textarea{min-height:140px}
}
@media (max-width:640px){
  .dashboard{padding:18px 16px}
  .dash-title{font-size:18px;margin-bottom:12px}
  /* 버튼 3개가 세로로 길게 쌓이지 않도록 한 줄에 나란히 · 아이콘 위 / 글자 아래 */
  .dash-quick{display:flex;gap:8px;margin-bottom:16px}
  .dash-quick .qbtn{flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:12px 6px;font-size:12px;line-height:1.3;text-align:center;word-break:keep-all;border-radius:10px}
  .dash-quick .qbtn .ic{font-size:18px}
  .dash-inquiry-banner{padding:12px 14px;font-size:13px;line-height:1.45;word-break:keep-all}
  .dcell{min-height:48px;font-size:11px}
  .dwed{font-size:9.5px}
}

/* ---------- responsive ---------- */
.mob-more-btn{display:none}
.mob-tabs{display:none}
@media (max-width:960px){
  .wrap{grid-template-columns:1fr}
  .pane-l{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .pane-r{padding:16px 12px 80px}
  .sheet-head,.pgm{padding-left:20px;padding-right:20px}
  .blk{grid-template-columns:1fr}
  .blk .cue{padding:16px 20px 0;background:transparent;border-right:0;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
  .blk .cue .ttl{margin-top:0}
  .blk .body{padding:12px 20px 22px}
  .sm-body .inner{font-size:22px}

  /* 상단바: 자주 쓰는 것만 노출, 나머지는 더보기(⋮)로 */
  .topbar{padding:10px 12px;gap:6px}
  .brand{display:none}
  .tb-div{display:none}
  .tb-group{flex-basis:100%;flex-wrap:wrap}
  .mob-more{display:none}
  .mob-more-btn{display:inline-flex;margin-left:auto}
  #fileSel{flex:1;min-width:0}
  .tb-group #btnLink,.tb-group #btnSend,.tb-group #btnInbox{flex:1;padding-left:8px;padding-right:8px}

  /* 본문: 입력 폼 / 대본 미리보기 탭 전환 */
  .mob-tabs{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .mob-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;font-size:14px;font-weight:700;color:var(--ink2);min-height:40px}
  .mob-tabs button.on{background:var(--wine);border-color:var(--wine);color:#fff}
  .wrap.tab-form .pane-r{display:none}
  .wrap.tab-preview .pane-l{display:none}
}

/* ---------- 모달 ---------- */

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  /* 화면 보이기/숨기기를 JS 인라인 style 로 다루므로, 인쇄 때는 !important 로 눌러야
     합니다. 그러지 않으면 대시보드에서 인쇄할 때 대본 대신 달력이 찍히거나 빈 장이 나옵니다. */
  .topbar,.pane-l,.tools,.toast,.stagemode,.modal,.edited-flag,
  #dashboard,.mob-tabs,.savebar,.lockscreen{display:none!important}
  .wrap{display:block!important}
  /* 인쇄에서는 미디어쿼리가 화면이 아니라 용지 폭으로 평가됩니다. A4 세로는 약 793px
     이라 모바일용 @media(max-width:960px) 규칙이 함께 걸립니다. .wrap 에는 tab-form
     이 늘 붙어 있어서 그 안의 ".wrap.tab-form .pane-r{display:none}" 때문에 대본이
     통째로 사라지고 빈 장만 나왔습니다. 인쇄에서는 탭 상태와 무관하게 대본을 보입니다. */
  .pane-r{display:block!important}
  .pane-r{padding:0}
  .sheet{border:0;border-radius:0;max-width:none;background:#fff}
  .sheet-head{padding:0 0 18px;border-bottom:2px solid #000}
  .pgm{padding:18px 0}
  .blk .cue{background:#fff}

  /* --- 큐시트(요약) 모드 : 화면과 동일한 2단 --- */
  body.pm-cue .blk{page-break-inside:avoid;border-bottom:1px solid #bbb;grid-template-columns:150px 1fr}
  body.pm-cue .blk .cue{padding:16px 14px 16px 0}
  body.pm-cue .blk .body{padding:16px 0 16px 18px}
  body.pm-cue .script{font-size:10.5pt;line-height:1.75}
  body.pm-cue .pgm{page-break-after:always}

  /* --- 리딩용(아이패드) 모드 : 1단 · 큰 글씨 · 순서당 한 장 --- */
  body.pm-read .blk{display:block;border:0;padding:0}
  body.pm-read .blk .cue{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:0 0 10px;border:0;border-bottom:1.5pt solid #000;margin-bottom:22px;
  }
  body.pm-read .blk .cue .num{font-size:10pt;letter-spacing:.14em;color:#666}
  body.pm-read .blk .cue .ttl{font-size:16pt;font-weight:700;margin:0}
  body.pm-read .blk .cue .tag{margin:0;font-size:10pt;border-color:#bbb;background:#fff;color:#000}
  body.pm-read .blk .cue .memo{margin:0;font-size:10pt;color:#444;flex-basis:100%}
  body.pm-read .blk .cue .time{margin:0;font-size:9.5pt;color:#888}
  body.pm-read .blk .body{padding:0}
  body.pm-read .script{
    font-size:var(--readpt,15pt);line-height:2.0;
    orphans:3;widows:3;
  }
  /* 호흡 구분(/) 표시. 화면에서는 배경색으로 그린 얇은 막대인데, 크롬은 "배경 그래픽"을
     끄면 배경을 인쇄하지 않아 통째로 사라졌습니다. 테두리는 그 설정과 무관하게 찍히므로
     테두리로 그리고, currentColor 를 써서 밝은 종이에서도 어두운 배경에서도 보이게 합니다. */
  .script .brk{background:transparent!important;width:0!important;
    border-left:1.1pt solid currentColor;opacity:.5;height:.95em;margin:0 .4em}
  /* 한 문장이 페이지·단 중간에서 잘리지 않게 합니다 */
  .script .ln{break-inside:avoid;page-break-inside:avoid}
  body.pm-read .script .stage{background:#F0F0F0;color:#000;border:.5pt solid #ccc;font-size:.85em}
  body.pm-read.pb-on .blk{page-break-after:always}
  body.pm-read.pb-on .blk:last-child{page-break-after:auto}
  body.pm-read:not(.pb-on) .blk{page-break-inside:avoid;margin-bottom:30px}
  body.pm-read.pm-land:not(.cols-on) .script{max-width:185mm}
  body.pm-read.cols-on .script{column-count:2;column-gap:14mm}
  body.pm-read.cols-on .script .stage{break-inside:avoid}
  body.pm-read .pgm{page-break-after:always}
  body.hide-pgm .pgm{display:none}
  body.hide-head .sheet-head{display:none}

  /* --- 어두운 배경(무대 모드처럼) ---
     print-color-adjust:exact 가 있어야 크롬이 "배경 그래픽" 설정과 무관하게 검은 바탕을
     찍습니다. 이게 없으면 흰 종이에 흰 글씨가 되어 아무것도 안 보입니다.
     여백까지 검게 채우려고 @page margin 을 0 으로 두므로(applyPrintClass), 글이 종이
     가장자리에 붙지 않도록 안쪽 여백을 여기서 줍니다. */
  body.pm-dark{background:#0F1115!important;color:#F2F3F5!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.pm-dark *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.pm-dark .pane-r{padding:13mm 15mm!important}
  body.pm-dark .sheet,body.pm-dark .pgm,body.pm-dark .blk,
  body.pm-dark .blk .cue,body.pm-dark .blk .body{background:#0F1115!important;color:#F2F3F5!important}
  body.pm-dark .sheet-head{border-bottom-color:#F2F3F5!important}
  body.pm-dark .blk{border-color:#39404A!important}
  body.pm-dark .blk .cue{border-bottom-color:#F2F3F5!important}
  body.pm-dark .blk .cue .num,body.pm-dark .blk .cue .time,
  body.pm-dark .blk .cue .memo{color:#AEB6C0!important}
  body.pm-dark .blk .cue .tag{background:transparent!important;color:#F2F3F5!important;border-color:#39404A!important}
  body.pm-dark .script .stage{background:#1C222B!important;color:#E7C88A!important;border-color:#39404A!important}
  body.pm-dark .script .kw{color:#fff!important}
  body.pm-dark .pgm,body.pm-dark .pgm *{color:#F2F3F5!important;border-color:#39404A!important}
}

<script>
/* =========================================================
   0. 예식 등록 전 · 사전 준비 자료 (DB.notes, 예식과 무관하게 하나만 존재)
   ========================================================= */
const DEFAULT_DM_REPLY=`안녕하세요 🌷
문의 감사합니다.

아래 링크에서 예식 정보를 남겨주시면
가능 여부를 확인한 뒤
하루 안에 답변드리겠습니다.

https://everafter-youngae.github.io/studio/`;

/* =========================================================
   1. 데이터 모델
   ========================================================= */
const SEC_DEFS = [
  {key:'preshow',  title:'식전 안내',        dur:0,   cue:'예식 15분 전 / 5분 전 2회'},
  {key:'opening',  title:'개식사',           dur:10,  cue:''},
  {key:'candle',   title:'화촉점화',         dur:70,  cue:'입장 동선 확인 · 동시 점화'},
  {key:'groom',    title:'신랑 입장',        dur:35,  cue:'입장 속도 체크'},
  {key:'bride',    title:'신부 입장',        dur:60,  cue:'신랑 맞이 동선 · 드레스 정돈'},
  {key:'bow',      title:'신랑·신부 맞절',   dur:25,  cue:'마주 선 자세 확인'},
  {key:'ring',     title:'반지 교환',        dur:60,  cue:'반지 전달자 확인', off:true},
  {key:'vow',      title:'혼인 서약',        dur:80,  cue:'서약서 준비 여부'},
  {key:'declare',  title:'성혼 선언문',      dur:15,  cue:'선언문 인쇄본 지참'},
  {key:'speech',   title:'축사',             dur:180, cue:'축사자 동선 · 마이크'},
  {key:'song',     title:'축가',             dur:240, cue:'축가자 동선 · MR 확인'},
  {key:'parents',  title:'양가 부모님께 인사',dur:70, cue:'드레스 매무새 · 혼주석 기립'},
  {key:'guests',   title:'내빈께 인사',      dur:20,  cue:'신랑·신부 정면 전환'},
  {key:'march',    title:'신랑·신부 행진',   dur:45,  cue:'행진 속도 · 하객 기립 유도'},
  {key:'closing',  title:'폐식사',           dur:15,  cue:'촬영 안내 · 연회장 위치'},
];

function blank(){
  const secs={};
  SEC_DEFS.forEach(d=>secs[d.key]={on:!d.off,cue:d.cue,music:'',text:null});
  return {
    id:'w'+Date.now().toString(36),
    groom:'', bride:'', date:'', time:'',
    youngaeCode:'', email:'', journeyNameCheck:'', linkKey:'',
    phone:'', kakao:'', consentAt:'', consentVer:'', consentSrc:'',
    archiveSentence:'', archiveScene:'', archiveClosing:'', archiveSentAt:'',
    sentencePicks:[],
    venue:'', floor:'', mcName:'',
    relation:'신부', relationText:'대학 동기', story:'',
    farGuests:'',
    candleParent:'어머님', candleOn:true,
    groomExtra:'',
    brideTwoStep:false, brideEscort:'없음',
    vowBy:'셀프', declareBy:'사회자',
    speechWho:'신부', speechRel:'', speechNames:'',
    songWho:'신랑', songRel:'', songName:'', songTitle:'',
    parentsStyle:'포옹', parentsFirst:'신부',
    marchYears:'', humble:true, photoNotice:true, memo:'',
    sections:secs,
  };
}

/* =========================================================
   2. 멘트 생성기  (( ) 안은 지문, / 는 호흡 구분)
   ========================================================= */
const G=w=>w.groom||'○○○', B=w=>w.bride||'○○○';
const gGun=w=>`신랑 ${G(w)} 군`, bYang=w=>`신부 ${B(w)} 양`;
function dateKo(w){
  if(!w.date) return '○○○○년 ○월 ○일';
  const [y,m,d]=w.date.split('-').map(Number);
  return `${y}년 / ${m}월 / ${d}일`;
}
function dateShort(w){
  if(!w.date) return '';
  const [y,m,d]=w.date.split('-').map(Number);
  const wd=['일','월','화','수','목','금','토'][new Date(w.date).getDay()];
  return `${y}. ${String(m).padStart(2,'0')}. ${String(d).padStart(2,'0')} (${wd})`;
}
function timeKo(w){
  if(!w.time) return '';
  const [h,m]=w.time.split(':').map(Number);
  const ap=h<12?'오전':'오후'; const hh=h%12===0?12:h%12;
  return `${ap} ${hh}시${m?` ${m}분`:''}`;
}

const GEN={
preshow:w=>`안내 말씀드립니다.

잠시 후 ${gGun(w)}과 ${bYang(w)}의 예식이 시작될 예정이오니 / 내빈 여러분들께서는 식장 안으로 입장하여 / 자리에 착석해 주시기 바랍니다.

소중한 시간을 위해 / 휴대폰은 잠시 꺼두거나 / 모두 진동으로 바꿔 주시기 바랍니다.`,

opening:w=>{
  const rel=w.relation==='신랑'?`신랑 ${G(w)} 군의 ${w.relationText||'○○'}`:`신부 ${B(w)} 양의 ${w.relationText||'○○'}`;
  const far=w.farGuests?`${w.farGuests}에서 / 먼 길 마다않고 / ` : '';
  const story=w.story?`\n\n${w.story}`:'';
  return `하객 여러분, 안녕하십니까.

저는 오늘 이 결혼식의 사회를 맡은 / ${rel}, / ${w.mcName||'○○○'}입니다.

먼저, 주말 귀한 시간 내어 / ${far}신랑 신부의 새로운 시작을 축복하러 와주신 / 모든 하객 여러분께 / 양가를 대신해 / 진심으로 감사의 인사를 전합니다.${story}

이제 두 사람이 하나 되어 걸어갈 첫 걸음이 / 오래도록 빛날 수 있도록, / 따뜻한 마음으로 지켜봐 주시고 / 축하의 박수도 많이 부탁드립니다.

그럼 지금부터, / ${gGun(w)}과 ${bYang(w)}의 결혼식을 / 시작하겠습니다.`;
},

candle:w=>{
  const P=w.candleParent, look=P==='어머님'?'곱게 한복을 차려입으신':'멋지게 차려입으신';
  return `먼저, 두 사람의 앞날을 밝혀줄 / 화촉 점화가 있겠습니다.

여러분 뒤쪽을 바라봐주세요. / ${look} / 두 분의 ${P}이 계십니다.

그동안 자녀를 사랑으로 길러오신 / 두 ${P}의 발걸음에 / 깊은 감사와 존경의 마음을 담아 / 따뜻한 박수로 맞이해주시기 바랍니다. / 양가 ${P} 입장!

let DB={list:[],cur:null};
const KEY='mc-weddings-v1';
const STORE=(typeof window!=='undefined'&&window.storage&&typeof window.storage.set==='function')
  ? window.storage
  : {
      get:async k=>{ const v=localStorage.getItem(k); if(v===null) throw new Error('not found'); return {key:k,value:v}; },
      set:async (k,v)=>{ localStorage.setItem(k,v); return {key:k,value:v}; },
    };

function cur(){ return DB.list.find(x=>x.id===DB.cur); }
function titleOf(w){
  const d=w.date?w.date.replace(/-/g,'.').slice(2):'날짜 미정';
  return `${d}  ${w.bride||'신부'} ♡ ${w.groom||'신랑'}`;
}
let saveTimer=null, saving=false, dirty=false, lastSaved='', failCount=0, lastWrite=0, storageOK=null;

function setStatus(s){
  const el=document.getElementById('saveStat'); if(!el) return;
  const map={
    saving:['저장 중…','var(--ink3)'],
    saved:['저장됨','var(--ink3)'],
    cloud:['저장됨 · 구글 시트 백업 완료','var(--ink3)'],
    retry:['다시 시도 중…','var(--gold)'],
    fail:['⚠ 자동 저장 안 됨 · 백업 파일로 저장하세요','var(--wine)'],
    off:['⚠ 이 브라우저에서는 자동 저장이 안 됩니다','var(--wine)'],
  };
  const [t,c]=map[s]||['',''];
  el.textContent=t; el.style.color=c;
  const bad=(s==='fail'||s==='off');
  el.style.background=bad?'var(--wine-soft)':'transparent';
  el.style.padding=bad?'6px 10px':'0';
  el.style.borderRadius='6px';
  el.style.fontWeight=bad?'500':'400';
  const bar=document.getElementById('saveBar');
  if(!bar) return;

    const b=document.getElementById('saveBarBackup');
    if(b) b.onclick=exportAllJson;
  }
}

function save(){
  dirty=true;
  /* 어느 쪽이 최신인지 다른 기기에서 판단할 수 있도록 수정 시각을 남깁니다 */
  const w0=cur(); if(w0) w0.updatedAt=new Date().toISOString();
  try{ scheduleBackup(); }catch(e){}
  if(storageOK===false){
    // 일시적인 문제일 수 있으므로 20초마다 한 번씩 다시 시도합니다.
    if(Date.now()-lastWrite<20000){ setStatus('fail'); return; }
    failCount=0;
  }
  setStatus('saving'); schedule();
}
function schedule(ms){
  if(saveTimer) return;
  const gap=Date.now()-lastWrite;
  saveTimer=setTimeout(flush, ms!=null?ms:Math.max(900,2200-gap));
}
async function flush(){
  saveTimer=null;
  if(saving||!dirty) return;
  const payload=JSON.stringify(DB);
  if(payload===lastSaved){ dirty=false; setStatus('saved'); return; }
  saving=true;
  try{
    await STORE.set(KEY,payload);
    lastSaved=payload; dirty=false; failCount=0; storageOK=true; lastWrite=Date.now();
    setStatus('saved');
  }catch(e){
    lastWrite=Date.now(); failCount++;
    if(failCount<=3){ setStatus('retry'); saving=false; schedule(1400*failCount); return; }
    storageOK=false; setStatus('fail');
  }finally{
    saving=false;
    if(dirty&&!saveTimer&&storageOK!==false) schedule();  }
}
async function load(){
  try{
    const r=await STORE.get(KEY);
    if(r&&r.value){ DB=JSON.parse(r.value); lastSaved=r.value; }
    storageOK=true;
  }catch(e){
    // 키가 아직 없으면 여기로 옵니다. 쓰기가 되는지 한 번 확인합니다.
    try{ await STORE.set(KEY+':probe','1'); storageOK=true; }
    catch(e2){ storageOK=false; }
  }
  if(!DB.list||!DB.list.length){ const w=blank(); DB={list:[w],cur:w.id}; }
  purgeOldTrash();
  if(!DB.list.some(w=>!w.deletedAt)){ const w=blank(); DB.list.push(w); DB.cur=w.id; }
  if(!cur()||cur().deletedAt) DB.cur=DB.list.find(w=>!w.deletedAt).id;
  DB.print=Object.assign({mode:'read',pt:15,pageBreak:true,program:true,cover:true,orient:'landscape',cols:false,dark:false},DB.print||{});
  DB.notes=DB.notes||{dmReply:DEFAULT_DM_REPLY,faq:[]};
  /* 주소는 이미 공개된 값이라 기본으로 채워둡니다 — 새 기기에서 입력할 칸이 하나 줄어듭니다 */
  DB.conn=DB.conn||{};
  if(!DB.conn.gs) DB.conn.gs=DEFAULT_GS;
  // 새로 추가된 섹션 보정
  DB.list.forEach(w=>{ w.youngaeCode=w.youngaeCode||''; w.email=w.email||'';
    w.phone=w.phone||''; w.kakao=w.kakao||''; w.consentAt=w.consentAt||''; w.consentVer=w.consentVer||''; w.consentSrc=w.consentSrc||''; w.archiveSentence=w.archiveSentence||''; w.archiveScene=w.archiveScene||''; w.archiveClosing=w.archiveClosing||''; w.sentencePicks=w.sentencePicks||[]; w.linkKey=w.linkKey||''; SEC_DEFS.forEach(d=>{ if(!w.sections[d.key]) w.sections[d.key]={on:!d.off,cue:d.cue,music:'',text:null}; }); });
  renderAll();
  setStatus(storageOK===false?'off':'saved');
  maybeNudgeBackup();
  maybeCheckNewReplies();
  showDashboard();
  maybeCheckNewInquiries();
  checkRemoteUpdates();
}

function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function autoSchedDate(dateStr,item){
  if(!dateStr) return '';
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  if(item.weeks!=null){
    d.setDate(d.getDate()-item.weeks*7);
    d.setDate(d.getDate()+((7-d.getDay())%7)); /* 그 주의 일요일로 (이미 일요일이면 그대로) */
  } else d.setDate(d.getDate()-item.days);
  return ymd(d);
}
function schedList(w){
  const ov=w.schedule||{};
  return SCHED.map(it=>{
    const date=ov[it.k]||autoSchedDate(w.date,it);
    const d=date?new Date(date+'T00:00:00'):null;
    return {k:it.k,t:it.t,who:it.who,step:it.step,date,
      label:d&&!isNaN(d)?`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`:'',
      edited:!!ov[it.k]};
  });
}

     한 줄이 길면 카톡이 아무 데서나 끊어 지저분해지므로, 같은 날짜라도

     맺음말도 쉼표에서 미리 끊어 어디서 줄이 바뀔지 정해둡니다. */

function flowHTML(){
  const w=cur(), st=w.steps||{};
  const firstOpen=FLOW.findIndex(f=>!st[f.k]);

  const plan={};

  if(w.date) plan.s8=schedList({date:w.date}).length?(()=>{const d=new Date(w.date+'T00:00:00');

  return `<div class="flow">

      const meta=done
        ? `<span class="when">${p?`예정 ${esc(p)} · `:''}${when} 완료</span>`
        : (p?`<span class="when plan">${esc(p)} 예정</span>`:'');
      return `<div class="fstep ${done?'done':''} ${now?'now':''}" data-step="${f.k}">
        <span class="mark">✓</span>
        <span class="t">${i+1}. ${f.t}${meta}</span>
      </div>`;
    }).join('')}
    ${firstOpen>-1?`<div class="next">다음 할 일 · ${FLOW[firstOpen].hint}</div>`
      :`<div class="next">모든 단계를 마쳤습니다. 예식 준비 완료!</div>`}

}

function textOf(key){
  const w=cur(), s=w.sections[key];
  if(s.text!=null) return s.text;
  return GEN[key](w);
}
function estimate(key){
  const d=SEC_DEFS.find(x=>x.key===key);
  const plain=textOf(key).replace(/\([^)]*\)/g,'').replace(/[\/\s]/g,'');
  return Math.round(plain.length/4.0)+d.dur;
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return m?`약 ${m}분 ${s?s+'초':''}`.trim():`약 ${s}초`;
}
function scriptHTML(t){
  const marked=esc(t)
    .replace(/\(([^)]*)\)/g,'<span class="stage">($1)</span>')
    .replace(/\s\/\s/g,'<span class="brk"></span>')
    .replace(/『([^』]*)』/g,'<span class="kw">$1</span>');
  /* 줄마다 감싸둡니다. 통짜 텍스트로 두면 인쇄할 때 한 문장이 페이지나 단 중간에서
     잘려 앞뒤가 따로 놉니다. 줄을 블록으로 만들어 두면 통째로 다음 장으로 넘깁니다. */
  return marked.split('\n').map(l=>`<span class="ln">${l}</span>`).join('');
}

let editingKey=null;

    <div class="meta">
      ${w.venue?`<span>예식장 <b>${esc(w.venue)}</b></span>`:''}

  const pgm=`<div class="pgm"><h2>식순</h2><table class="pgm-t">
    ${list.map((d,i)=>{

    const body = editingKey===d.key
      ? `<textarea class="edit" data-edit="${d.key}">${esc(textOf(d.key))}</textarea>
         <div class="tools" style="opacity:1">

           <button data-act="reset" data-key="${d.key}">기본 멘트로 되돌리기</button>
         </div>`

           <button data-act="edit" data-key="${d.key}">멘트 수정</button>
           <button data-act="cue" data-key="${d.key}">큐 / 음악</button>
           <button data-act="copy1" data-key="${d.key}">이 순서만 복사</button>
         </div>`;
    return `<div class="blk">
      <div class="cue">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="ttl">${d.title}${s.text!=null?'<span class="edited-flag">수정됨</span>':''}</div>
        ${s.music?`<div class="tag">♪ ${esc(s.music)}</div>`:''}

/* =========================================================
   5-b. 연락처 · 개인정보 보관
   수집 동의 문구(ask.html PRIVACY_VER)와 짝을 이룹니다.
   보유 기간: 수집일 ~ 예식일 1년 후. 지나면 연락처만 지우고 대본은 남깁니다.
   ========================================================= */
/* 국제전화 형태(+82 10-…)로 들어온 번호는 앞의 0이 빠져 있어 그대로 두면
   "104-613-1038"처럼 어긋납니다. 국가번호를 떼고 0을 되살립니다. */
function normPhone(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0082')) d=d.slice(4);
  else if(d.startsWith('82')&&d.length>=11&&d.length<=13) d=d.slice(2);
  if((d.length===9||d.length===10)&&d[0]!=='0') d='0'+d;
  return d.slice(0,12);
}
function fmtPhone(raw){
  const d=normPhone(raw);
  if(d.length===12) return `${d.slice(0,4)}-${d.slice(4,8)}-${d.slice(8)}`; /* 0507 안심번호 */
  if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length===10) return d.startsWith('02')?`${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}`:`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===9&&d.startsWith('02')) return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;
  if(d.length>3) return `${d.slice(0,3)}-${d.slice(3)}`;
  return d;
}
const RETAIN_YEARS=1;
function retainUntil(w){
  if(!w.date) return '';
  const d=new Date(w.date+'T00:00:00');
  if(isNaN(d)) return '';
  d.setFullYear(d.getFullYear()+RETAIN_YEARS);
  /* toISOString은 UTC로 밀려 하루가 어긋나므로 현지 날짜 그대로 씁니다 */
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function contactExpired(w){
  const u=retainUntil(w);
  return !!(u && (w.phone||w.kakao) && todayStr()>u);
}
function consentHint(w){
  if(w.consentAt){
    const d=new Date(w.consentAt);
    const when=isNaN(d)?esc(w.consentAt):`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    return `수집 동의 완료 · ${when}${w.consentVer?` (v${esc(w.consentVer)})`:''}`;
  }
  if(w.phone||w.kakao) return '<b style="color:var(--wine)">동의 기록 없음</b> · 질문지로 받으면 자동 기록됩니다';
  return '두 분 중 한 분 것이면 충분합니다.';
}
function retentionHTML(w){
  if(!contactExpired(w)) return '';
  return `<div class="retain-warn">
    <b>보관 기간이 지난 연락처가 있습니다.</b>
    <span>예식일(${esc(w.date)}) 기준 ${RETAIN_YEARS}년이 지나 ${esc(retainUntil(w))}까지가 보관 기간이었습니다. 안내한 대로 지워주세요.</span>
    <button class="btn" id="btnWipeExpired">연락처 지우기</button>
  </div>`;
}
function wipeContact(w,quiet){
  w.phone=''; w.kakao=''; w.consentAt=''; w.consentVer=''; w.consentSrc='';
  save(); renderForm();
  if(!quiet) toast('연락처를 지웠습니다. 대본과 나머지 기록은 그대로 있습니다.');
}

  if(t.dataset.k){ const w=cur(); w[t.dataset.k]=t.value; save();

    if((t.dataset.k==='phone'||t.dataset.k==='kakao')&&t.value&&!w.consentAt) w.consentSrc=w.consentSrc||'manual';
    /* 예식일·이름이 바뀌면 일정과 고객 화면 문구가 함께 바뀝니다 */

  if(t.dataset.sk){ const w=cur(); w.sections[t.dataset.sk][t.dataset.sf]=t.value; save();

});

    if(w.schedule&&Object.keys(w.schedule).length&&!confirm('직접 지정한 날짜를 지우고 예식일 기준 자동 날짜로 되돌립니다.')) return;

function purgeOldTrash(){
  const cutoff=Date.now()-30*86400000;
  const before=DB.list.length;
  DB.list=DB.list.filter(w=>!w.deletedAt||new Date(w.deletedAt).getTime()>cutoff);
  return before-DB.list.length;
}
document.getElementById('btnTrash').onclick=()=>{
  const draw=()=>{
    const items=DB.list.filter(w=>w.deletedAt).sort((a,b)=>new Date(b.deletedAt)-new Date(a.deletedAt));
    if(!items.length){
      openModal('휴지통','<div class="pv-note">휴지통이 비어 있습니다.</div>',`<button class="btn primary" id="tClose">닫기</button>`);
      document.getElementById('tClose').onclick=closeModal; return;
    }
    openModal('휴지통',
      `<div class="pv-note" style="margin-bottom:14px">삭제한 지 30일이 지나면 자동으로 완전히 삭제됩니다.</div>
       ${items.map(w=>{
         const days=Math.floor((Date.now()-new Date(w.deletedAt).getTime())/86400000);
         return `<div class="opt"><span class="lbl">${esc(titleOf(w))}
           <span class="sub">${days<1?'오늘':days+'일 전'} 삭제 · ${Math.max(0,30-days)}일 후 자동 삭제</span></span>
           <button class="btn" data-restore="${w.id}">복구</button>
           <button class="btn quiet" data-purge="${w.id}">완전 삭제</button></div>`;
       }).join('')}`,
      `<button class="btn primary" id="tClose">닫기</button>`);
    document.getElementById('tClose').onclick=closeModal;
    document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{
      const w=DB.list.find(x=>x.id===b.dataset.restore);
      if(w){ delete w.deletedAt; DB.cur=w.id; }
      save(); closeModal(); showEditor(); toast('복구했습니다.');
    });

    });

};

/* 예전에는 대체 경로가 실패해도 무조건 "복사했습니다"라고 알렸습니다. 휴대폰에서
   조용히 실패하면 사용자는 복사된 줄 알고 엉뚱한 것을 붙여넣게 됩니다. 이제
   실제 성공 여부를 확인하고, 안 되면 안 됐다고 알립니다. */
function copyFallback(t){
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function copyText(t,okMsg){
  const done=()=>toast(okMsg||'복사했습니다.');
  const fail=()=>{ if(copyFallback(t)) done(); else toast('복사가 되지 않았습니다. 화면의 글을 직접 선택해 복사해 주세요.',5000); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,fail);
  else fail();
}

function importAllJson(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      const incoming=(parsed&&parsed.db&&Array.isArray(parsed.db.list))?parsed.db:parsed;
      if(!incoming||!Array.isArray(incoming.list)||!incoming.list.length) throw new Error('empty');
      if(DB.list.length===1&&isBlankWedding(DB.list[0])){ DB.list=[]; DB.cur=null; }
      let added=0, skipped=0;
      incoming.list.forEach(w=>{
        if(!w||!w.id){ skipped++; return; }
        if(DB.list.some(x=>x.id===w.id)){ skipped++; return; }
        w.sections=w.sections||{};
        SEC_DEFS.forEach(d=>{ if(!w.sections[d.key]) w.sections[d.key]={on:!d.off,cue:d.cue,music:'',text:null}; });
        DB.list.push(w); added++;
      });
      if(incoming.conn && !DB.conn) DB.conn=incoming.conn;
      if(!cur()) DB.cur=DB.list.length?DB.list[0].id:null;
      if(!DB.list.length){ const w=blank(); DB.list=[w]; DB.cur=w.id; }
      save(); renderAll();
      toast(`${added}건을 불러왔습니다.${skipped?` (이미 있거나 형식이 다른 ${skipped}건은 건너뜀)`:''}`);
    }catch(e){ toast('파일을 읽지 못했습니다. 전체 백업 파일(.json)인지 확인해 주세요.'); }
  };
  r.readAsText(f);
}

function createWeddingFromInquiry(inq){
  const w=blank();
  const m=String(inq.date||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) w.date=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  w.venue=inq.venue||'';
  /* 연락처는 메모에 묻어두지 않고 전용 칸으로 넣습니다 — 매번 찾아 옮기지 않도록.
     문의 폼에서 온 값은 형식이 제각각이라, 번호처럼 보이면 연락처로 자동 분리합니다. */
  const ci=String(inq.contactInfo||'').trim();
  const d=normPhone(ci);
  if(d.length>=9&&d.length<=11) w.phone=fmtPhone(ci);
  else if(ci) w.kakao=ci;
  if(ci&&inq.consentAt){ w.consentAt=inq.consentAt; w.consentVer=inq.consentVer||''; w.consentSrc='inquiry'; }
  else if(ci) w.consentSrc='inquiry';
  w.memo=`[홈페이지 문의]\n이름: ${inq.names||''}\n날짜: ${inq.date||''}\n장소: ${inq.venue||''}\n메시지: ${inq.message||'(없음)'}`;
  DB.list.push(w); DB.cur=w.id; save();
  return w;
}

  const l=smList(); if(!l.length) return;
  smIdx=Math.max(0,Math.min(smIdx,l.length-1));
  const d=l[smIdx], s=cur().sections[d.key];
  document.getElementById('smStep').textContent=`${smIdx+1} / ${l.length}`;
  document.getElementById('smTitle').textContent=d.title;
  document.getElementById('smCue').textContent=[s.music&&('♪ '+s.music),s.cue].filter(Boolean).join('\n');
  document.getElementById('smBody').innerHTML=scriptHTML(textOf(d.key));
  document.getElementById('smProg').style.width=((smIdx+1)/l.length*100)+'%';
  document.querySelector('.sm-body').scrollTop=0;

  return {
    id:w.id, bride:w.bride, groom:w.groom, mc:w.mcName, dateLabel:dateShort(w),
    date:w.date, time:w.time, venue:w.venue, floor:w.floor,
    sched:schedList(w).filter(r=>r.date).map(r=>({t:r.t,who:r.who,label:r.label})),
    def:{on,music,candleParent:w.candleParent,
      brideTwoStep:w.brideTwoStep?'문 뒤에서 등장 후 입장':'한 번에 입장',

      vowBy:w.vowBy==='셀프'?'두 사람이 직접 낭독':'주례가 진행',
      declareBy:w.declareBy, speechWho:w.speechWho, speechRel:w.speechRel, speechNames:w.speechNames,

function authErr_(e,fallback){ return e==='unauthorized'?'관리자 토큰이 맞지 않습니다. 응답 링크에서 확인해 주세요.':(e||fallback); }
async function pushConfig(){
  const c=DB.conn||{};
  if(!c.gs) throw new Error('앱스 스크립트 주소가 아직 없습니다.');
  const r=await fetch(c.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({type:'config',id:cur().id,cfg:askConfig(),token:adminToken()})});
  const j=await r.json();
  if(!j.ok) throw new Error(authErr_(j.error,'설정을 올리지 못했습니다.'));
}

function adminToken(){ return ((DB.conn||{}).token||'').trim(); }

/* 예식마다 추측할 수 없는 링크키를 하나씩 둡니다. 예전에는 영애 코드(순번)만
   알면 남의 예식도 열렸기 때문입니다. 한 번 받아오면 예식에 저장해 두고
   그대로 씁니다. 링크를 만들기 전에 불러야 합니다. */
async function ensureLinkKey(w){
  if(!w) return '';
  if(w.linkKey) return w.linkKey;
  const c=DB.conn||{};
  if(!c.gs) return '';
  try{
    const r=await fetch(c.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'linkKey',id:w.id,token:adminToken()})});
    const j=await r.json();
    if(j.ok&&j.t){ w.linkKey=j.t; save(); return w.linkKey; }
  }catch(e){}
  return '';
}

/* ---------- Everafter Journey · 편지 ---------- */
function normalizeYoungae(v){
  const n=String(v||'').replace(/영애/gi,'').replace(/[^0-9]/g,'');
  return n.length===6 ? `${n.slice(0,4)}_${n.slice(4)}` : '';
}
function ensureYoungaeCode(w){
  if(w.youngaeCode){ w.youngaeCode=normalizeYoungae(w.youngaeCode)||w.youngaeCode; return w.youngaeCode; }
  const d=(w.date||'').replace(/-/g,'');
  if(d.length<6) return '';
  const ym=d.slice(2,6);
  const nums=DB.list.filter(x=>x.id!==w.id && normalizeYoungae(x.youngaeCode||'').startsWith(ym+'_'))
    .map(x=>Number((normalizeYoungae(x.youngaeCode||'').split('_')[1]||0))).filter(Boolean);
  w.youngaeCode=`${ym}_${String((nums.length?Math.max(...nums):0)+1).padStart(2,'0')}`;
  save(); return w.youngaeCode;
}
function journeyLink(){
  const c=DB.conn||{}, ask=(c.ask||'').trim().replace(/#.*$/,'');
  const w=cur();
  const code=ensureYoungaeCode(w);
  const base=(c.journey||ask.replace(/[^/]*$/,'story.html')||'https://주소를-먼저-설정하세요/story.html').replace(/#.*$/,'');
  // 카카오톡 등 인앱 브라우저가 링크 속 한글을 다루다 깨뜨리는 경우가 있어,
  // 공유되는 링크는 영문/숫자로만 이루어지도록 인코딩합니다.
  const hash=encodeURIComponent('영애'+code)+(w.linkKey?('.'+w.linkKey):'');
  return base+'#'+hash+(c.longLink?('~'+gsId(c.gs)):'');
}
function publicJourneyState(w){
  const st=w.steps||{};
  if(st.s10) return ['archive','오늘의 기억을 남겼어요'];
  if(st.s8) return ['after','Everafter 편지를 준비하고 있어요'];
  if(st.s7) return ['wedding','그날을 기다리고 있어요'];
  if(st.s6) return ['final','마지막 대본이 준비되었어요'];
  if(st.s5) return ['together','마지막 문장을 다듬고 있어요'];
  if(st.s4) return ['second','두 번째 대본이 준비되었어요'];
  if(st.s3) return ['together','함께 다듬고 있어요'];
  if(st.s2) return ['first','첫 번째 대본이 준비되었어요'];
  if(st.s1) return ['story','두 분의 이야기를 기다리고 있어요'];
  return ['welcome','처음 인사를 나누었어요'];
}
async function pushJourney(){
  const c=DB.conn||{}, w=cur();
  if(!c.gs) throw new Error('앱스 스크립트 주소가 아직 없습니다.');
  ensureYoungaeCode(w);
  const payload={
    id:w.id, code:w.youngaeCode, bride:w.bride, groom:w.groom, date:w.date, time:w.time,
    email:w.email||'', steps:w.steps||{}, archiveSentence:w.archiveSentence||'',
    archiveScene:w.archiveScene||'', archiveClosing:w.archiveClosing||'', reviewLink:reviewLink(),
    sentencePicks:w.sentencePicks||[],
    sched:schedList(w).filter(r=>r.date).map(r=>({t:r.t,who:r.who,label:r.label})),
    /* 타임라인 칸별 예정일 (s1…s7) */
    plan:schedList(w).reduce((o,r)=>{ if(r.step&&r.label) o[r.step]=r.label; return o; },{})
  };
  const r=await fetch(c.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({type:'journey',id:w.id,data:payload,token:adminToken()})});
  const j=await r.json(); if(!j.ok) throw new Error(authErr_(j.error,'고객 화면 정보를 올리지 못했습니다.'));
  w.journeyPushedAt=new Date().toISOString(); save();
}
/* 한 번이라도 고객 화면에 올린 예식이라면, 이후 일정·단계가 바뀔 때 자동으로 다시 올립니다.
   매번 "화면 정보 올리기"를 눌러야 하는 걸 잊으면 고객에게 옛 날짜가 보이기 때문입니다.
   아직 올린 적 없는 예식은 건드리지 않습니다(공유 전에 기록을 만들지 않도록). */
function syncJourneySoon(){
  const w=cur();
  if(!w||!w.journeyPushedAt||!(DB.conn||{}).gs) return;
  clearTimeout(window._jsync);
  window._jsync=setTimeout(()=>{
    pushJourney().catch(()=>{ /* 실패해도 조용히 — 필요하면 수동으로 다시 올릴 수 있습니다 */ });
  },1500);
}
function letterText(w){
  return `두 분의 이야기를 처음 들었던 날부터 오늘에 이르기까지 여러 문장을 함께 쓰고 다듬었습니다.\n\n그렇게 준비한 문장들이 두 분의 하루 속에서 웃음이 되고, 한 장면의 기억이 되었기를 바랍니다.\n\n${w.archiveScene||'예식은 끝났지만 그날 나눈 마음은 두 분이 함께 살아갈 시간 속에서 오래 이어질 거예요.'}\n\n영애, 오래 사랑한다는 마음을 담아 두 분의 앞으로를 조용히 응원하겠습니다.\n\n${w.archiveClosing||'두 분의 오래 기억될 하루를 함께할 수 있어 기뻤습니다.'}`;
}
async function sendEverafterLetter(){
  const c=DB.conn||{}, w=cur();
  if(!c.gs) throw new Error('앱스 스크립트 주소가 아직 없습니다.');
  if(!w.email) throw new Error('받는 이메일을 먼저 입력해 주세요.');
  await pushJourney();
  const r=await fetch(c.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({type:'sendArchive',id:w.id,email:w.email,journeyUrl:journeyLink(),token:adminToken()})});
  const j=await r.json(); if(!j.ok) throw new Error(authErr_(j.error,'메일을 보내지 못했습니다.'));
  w.archiveSentAt=new Date().toISOString(); markStep('s10'); save();
}
/* 고객에게 이야기 링크를 보낼 때 쓰는 기본 문구.
   카톡에서 줄이 아무 데서나 끊기지 않도록 문장을 미리 끊어둡니다. */
function journeyMsg(w){
  return [`🕊️💌 ${w.bride||'신부'} · ${w.groom||'신랑'} 두 분의 이야기를`,
    '차근차근 준비하고 있습니다.','',

    '필요하실 때마다 편하게 찾아와 주세요.','',
    `🔗 ${journeyLink()}`,'',
    '오래 기억될 하루를 함께 만들어가겠습니다.'].join('\n');
}
/* 링크를 보내기 전에 고객 화면 정보를 올려둡니다. 안 올린 채로 링크만 보내면
   빈 화면이 열립니다. 클립보드는 사용자 클릭 직후에 써야 막히지 않으므로
   복사를 먼저 하고 올리기는 뒤에서 진행합니다. */
function copyJourney(text){

  pushJourney().catch(()=>toast('링크는 복사했지만 고객 화면 정보를 올리지 못했습니다. "화면 정보 올리기"를 눌러 주세요.'));
}

/* ---------- 구글 시트 자동 백업 ---------- */
let bkTimer=null;
const bkLast={};            /* 예식별 마지막으로 올린 내용 */
const bkPending=new Set();  /* 올려야 할 예식 목록 */
/* 예전에는 8초 뒤 "그 시점의 현재 예식"을 올렸습니다. 그래서 A를 고치고 8초 안에
   B로 옮기면 A 대신 B가 올라가고, A의 수정은 시트에 영영 반영되지 않았습니다.
   이제 고친 예식을 목록에 담아두고 한꺼번에 올립니다. */
function scheduleBackup(){
  if(!(DB.conn||{}).gs) return;
  if(DB.cur) bkPending.add(DB.cur);
  clearTimeout(bkTimer);
  bkTimer=setTimeout(flushBackups,8000);
}
async function flushBackups(){
  if(!(DB.conn||{}).gs) return;
  const ids=[...bkPending]; bkPending.clear();
  for(const id of ids){
    const w=DB.list.find(x=>x.id===id);
    if(!w) continue;
    /* updatedAt 만 달라진 것으로는 다시 올리지 않습니다 */
    const payload=JSON.stringify(Object.assign({},w,{updatedAt:''}));
    if(payload===bkLast[id]) continue;
    try{
      const r=await fetch(DB.conn.gs,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({type:'backup',id:w.id,title:titleOf(w),data:w,token:adminToken()})});
      const j=await r.json();
      if(j.ok){ bkLast[id]=payload; setStatus('cloud'); }
      else bkPending.add(id);
    }catch(e){ bkPending.add(id); /* 다음 변경 때 다시 시도 */ }
  }
}

async function fetchBackups(){
  const gs=(DB.conn||{}).gs;
  if(!gs) throw new Error('앱스 스크립트 주소가 아직 없습니다. 응답 링크에서 먼저 설정해 주세요.');
  const r=await fetch(gs+(gs.includes('?')?'&':'?')+'backups=1&token='+encodeURIComponent(adminToken()));
  const j=await r.json();
  if(!j.ok) throw new Error(authErr_(j.error,'불러오지 못했습니다.'));
  return j.backups||[];
}

/* ---------- 다른 기기에서 고친 내용 확인 ----------
   저장은 기기마다 따로(localStorage)라, PC에서 고쳐도 휴대폰을 열면 예전 내용이
   보입니다. 열 때 시트를 한 번 훑어 내용이 다른 예식이 있으면 알려주고, 누르면
   그 예식만 최신으로 바꿉니다. 자동으로 덮어쓰지는 않습니다 — 어느 쪽이 최신인지
   기기가 확실히 알 수 없고, 잘못 덮으면 되돌릴 수 없기 때문입니다. */
let SYNC_DIFFS=[];
function sameWedding(a,b){
  const strip=w=>JSON.stringify(Object.assign({},w,{updatedAt:''}));
  return strip(a)===strip(b);
}
async function checkRemoteUpdates(){
  if(!(DB.conn||{}).gs||!adminToken()) return;
  let list;
  try{ list=await fetchBackups(); }catch(e){ return; }
  const diffs=[];
  list.forEach(b=>{
    const d=b&&b.data;
    if(!d||!d.id||d.deletedAt) return;
    /* 이 기기에 이미 있는 예식만 다룹니다. 시트에는 예전에 "시트에서 불러오기"로
       사본을 만들며 생긴 줄이 여럿 쌓여 있을 수 있는데, 그것까지 권하면 누를 때마다
       예식이 하나씩 늘어납니다. 이 기기에 없는 예식을 되살리는 일은 기존
       "시트에서 불러오기"가 맡습니다. */
    const local=DB.list.find(x=>x.id===d.id);
    if(!local||local.deletedAt||sameWedding(local,d)) return;
    diffs.push({ts:b.ts,title:b.title,data:d,localAt:local.updatedAt||''});
  });
  SYNC_DIFFS=diffs;
  if(diffs.length&&document.getElementById('dashboard').style.display==='block') renderDashboard();
}
function pullRemote(d){
  const w=JSON.parse(JSON.stringify(d.data));
  SEC_DEFS.forEach(s=>{ if(!w.sections[s.key]) w.sections[s.key]={on:!s.off,cue:s.cue,music:'',text:null}; });
  const i=DB.list.findIndex(x=>x.id===w.id);
  if(i>-1) DB.list[i]=w; else DB.list.push(w);
  SYNC_DIFFS=SYNC_DIFFS.filter(x=>x.data.id!==w.id);
  save();
}
function drawSync(){
  if(!SYNC_DIFFS.length){ closeModal(); toast('모두 최신입니다.'); renderDashboard(); return; }
  const when=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'기록 없음';
  openModal('다른 기기에서 고친 내용',
    `<div class="pv-note" style="margin-bottom:14px">구글 시트에 있는 내용이 이 기기와 다릅니다.
       <b>가져오기</b>를 누르면 이 기기의 해당 예식이 시트 내용으로 <b>제자리에서</b> 바뀝니다
       (사본이 생기지 않습니다). 되돌릴 수 없으니 이 기기에서 방금 고친 것이 있다면
       먼저 백업 파일로 내려받아 두세요.</div>
     ${SYNC_DIFFS.map((d,i)=>`<div class="opt"><span class="lbl">${esc(d.title||'제목 없음')}
       <span class="sub">시트 ${esc(when(d.ts))} · 이 기기 ${esc(when(d.localAt))}</span></span>
       <button class="btn" data-pull="${i}">가져오기</button></div>`).join('')}`,
    `<button class="btn" id="sClose">닫기</button>
     <button class="btn primary" id="sAll">전부 가져오기</button>`);
  document.getElementById('sClose').onclick=closeModal;
  document.getElementById('sAll').onclick=()=>{
    if(!confirm('시트에 있는 내용으로 전부 바꿉니다. 되돌릴 수 없습니다. 계속할까요?')) return;
    [...SYNC_DIFFS].forEach(pullRemote); closeModal(); renderAll(); renderDashboard(); toast('최신 내용으로 바꿨습니다.');
  };
  document.querySelectorAll('[data-pull]').forEach(b=>b.onclick=()=>{
    pullRemote(SYNC_DIFFS[+b.dataset.pull]); drawSync(); renderAll(); toast('가져왔습니다.');
  });
}

          ? '예식 당일, 이 이야기로 두 분을 소개하겠습니다.'

async function fetchResponses(){
  const gs=(DB.conn||{}).gs;
  if(!gs) throw new Error('앱스 스크립트 주소가 아직 없습니다.');
  const get=async q=>{
    const r=await fetch(gs+(gs.includes('?')?'&':'?')+q+'&token='+encodeURIComponent(adminToken()));
    const j=await r.json();
    if(!j.ok) throw new Error(authErr_(j.error,'불러오지 못했습니다.'));
    return j.items||[];
  };
  const mine=await get('id='+encodeURIComponent(cur().id));
  if(mine.length) return {items:mine,wide:false};
  const all=(await get('all=1')).filter(x=>x&&(x.secs||x.notes));
  all.sort((a,b)=>new Date(b.ts||0)-new Date(a.ts||0));
  return {items:all,wide:true};
}


const STORY_Q={q1:'한 문장 소개',q2:'꼭 알았으면 하는 이야기',q8:'평생을 함께하고 싶었던 순간',q3:'기억되고 싶은 결혼식',
  q4:'부모님 인사 톤',q5:'친구 관련 이야기',q6:'피했으면 하는 것',q7:'꼭 담겼으면 하는 것'};
function storyText(st){
  if(!st) return '';
  return Object.keys(STORY_Q).map(k=>{
    let v=st[k]; if(!v) return '';
    if(typeof v==='object') v=[...(v.sel||[]),v.etc].filter(Boolean).join(', ');
    if(!String(v).trim()) return '';
    return `[${STORY_Q[k]}]\n${v}`;
  }).filter(Boolean).join('\n\n');
}
function storyHTML(st){
  if(!st) return '';
  const rows=Object.keys(STORY_Q).map(k=>{
    let v=st[k]; if(!v) return '';
    if(typeof v==='object') v=[...(v.sel||[]),v.etc].filter(Boolean).join(', ');
    if(!String(v).trim()) return '';
    const warn=(k==='q6');
    return `<div class="opt" style="align-items:flex-start">
      <span class="lbl" style="${warn?'color:var(--wine)':''}">${warn?'⚠ ':''}${STORY_Q[k]}
        <span class="sub" style="white-space:pre-wrap;color:${warn?'var(--wine)':'var(--ink2)'}">${esc(v)}</span></span></div>`;
  }).filter(Boolean).join('');
  return rows?`<div class="pv-note" style="margin-bottom:6px">두 분이 들려주신 이야기</div>${rows}`:'';
}

  brideTwoStep:{f:'brideTwoStep',to:v=>v.indexOf('등장')>-1,disp:v=>v?'등장 후 입장':'한 번에 입장'},

  speechWho:{f:'speechWho'},speechRel:{f:'speechRel'},speechNames:{f:'speechNames'},

const FIELD_LABEL={date:'예식일',time:'예식 시간',venue:'예식장',floor:'연회장 층',
  candleParent:'화촉 점화 주체',brideTwoStep:'신부 입장 방식',brideEscort:'신부 동행자',

const show=v=>v===true?'포함':v===false?'제외':(v===''||v==null?'(비어 있음)':String(v));

function diffOf(res){
  const w=cur(), out=[];
  if(res.type==='review'){
    SEC_DEFS.forEach(d=>{
      const n=(res.notes||{})[d.key]; if(!n||!n.text) return;
      const s=w.sections[d.key];
      if((s.cue||'').indexOf(n.text)>-1) return;
      out.push({t:d.title+' – 수정 요청',now:s.cue,val:n.text,
        apply:()=>{ s.cue=(s.cue?s.cue+' / ':'')+'[요청] '+n.text; }});
    });
    return out;
  }
  if(res.story){
    const t=storyText(res.story);
    if(t && (w.memo||'').indexOf(t)<0)
      out.push({t:'두 분의 이야기 → 예식 메모',now:w.memo?'메모 있음':'',val:'메모에 저장',
        apply:()=>{ w.memo=(w.memo?w.memo+'\n\n':'')+t; }});
  }
  Object.keys(res.basic||{}).forEach(k=>{
    const nv=res.basic[k]; if(nv==null||nv==='') return;
    if(String(w[k]||'')!==String(nv)) out.push({t:FIELD_LABEL[k]||k,now:w[k],val:nv,apply:()=>{w[k]=nv;}});
  });
  /* 연락처는 동의 기록과 함께 들어옵니다 — 동의 없이 온 값은 반영하지 않습니다 */
  const ct=res.contact||{}, cs=res.consent;
  if(cs&&cs.agreed){
    if(ct.phone&&String(w.phone||'')!==String(ct.phone))
      out.push({t:'연락처',now:w.phone,val:ct.phone,
        apply:()=>{ w.phone=ct.phone; w.consentAt=cs.at||''; w.consentVer=cs.ver||''; w.consentSrc='ask'; }});
    if(ct.kakao&&String(w.kakao||'')!==String(ct.kakao))
      out.push({t:'카카오톡 ID',now:w.kakao,val:ct.kakao,
        apply:()=>{ w.kakao=ct.kakao; w.consentAt=cs.at||''; w.consentVer=cs.ver||''; w.consentSrc='ask'; }});
  }
  Object.keys(res.opts||{}).forEach(k=>{
    const m=OPT_MAP[k]; if(!m) return;
    let nv=res.opts[k]; if(nv==null||nv==='') return;
    if(m.to) nv=m.to(nv);
    if(String(w[m.f])!==String(nv)) out.push({t:FIELD_LABEL[k]||k,
      now:m.disp?m.disp(w[m.f]):w[m.f], val:m.disp?res.opts[k]:nv, apply:()=>{w[m.f]=nv;}});
  });
  SEC_DEFS.forEach(d=>{
    if(res.skipSecs) return;
    const r=(res.secs||{})[d.key]; if(!r) return;
    const s=w.sections[d.key];
    if(r.use==='on'&&!s.on) out.push({t:d.title+' – 순서',now:false,val:true,apply:()=>{s.on=true;}});
    if(r.use==='off'&&s.on) out.push({t:d.title+' – 순서',now:true,val:false,apply:()=>{s.on=false;}});
    if(r.music&&r.music!==s.music) out.push({t:d.title+' – 음악',now:s.music,val:r.music,apply:()=>{s.music=r.music;}});
    if(r.note&&(s.cue||'').indexOf(r.note)<0)
      out.push({t:d.title+' – 요청사항',now:s.cue,val:r.note,apply:()=>{s.cue=(s.cue?s.cue+' / ':'')+r.note;}});
  });
  return out;
}

      </select></div>`:''}
     ${WIDE?`<div class="pv-note" style="margin-bottom:10px;color:var(--wine)">이 예식으로 표시된 응답이 없어 <b>시트에 있는 모든 예식의 응답</b>을 최신순으로 보여드립니다.<br>대부분 방금 받은 응답이 맨 위에 있으니 이름으로 찾아 맞는 것을 골라주세요.<br>이 화면이 자주 뜬다면 예식을 <b>복제</b>했거나 응답 링크를 다시 만들며 예식 ID가 바뀌었을 수 있습니다.</div>`:''}
     ${res.type==='review'?(()=>{
        const ns=Object.values(res.notes||{});
        const ok=ns.filter(x=>x.v==='ok').length, fx=ns.filter(x=>x.v==='fix').length;
        return `<div class="pv-note" style="margin-bottom:10px">대본 검토 결과 · 그대로 좋다 <b>${ok}개</b> · 고쳐달라 <b style="color:var(--wine)">${fx}개</b></div>`;
      })():''}
     <div class="pv-note" style="margin-bottom:14px">${esc(res.name||'신랑신부')}님 · ${esc(when)} 도착
       ${res.free?`<br><br><b>남기신 말</b><br>${esc(res.free)}`:''}</div>
     ${skipNote}

     ${story?'<div class="pv-note" style="margin:14px 0 6px">대본에 반영할 항목</div>':''}
     ${rows}`,
    `<button class="btn" id="iClose">닫기</button>
     ${DIFF.length?`<button class="btn primary" id="iApply">선택한 항목 반영</button>`:''}`);
  const sel=document.getElementById('iSel'); if(sel) sel.onchange=e=>renderInbox(items,+e.target.value);

/* =========================================================
   11. 운영자 인증 (이 브라우저 안에서만 유효)
   ---------------------------------------------------------
   정적 사이트라 완전한 보안은 아닙니다 — 소스를 볼 수 있는 사람은
   우회할 수 있지만, 링크만 아는 사람이나 같은 컴퓨터를 쓰는 다른
   사람이 예식 정보를 무심코 열어보는 것은 막아줍니다.
   ========================================================= */
/* ===== 설정 옮기기 =========================================
   새 기기·새 브라우저에서 열면 저장소가 비어 있어 주소·토큰을 다시 넣어야 했습니다.
   주소는 이미 공개된 값(shared.js 에 들어 있어 고객 페이지가 씁니다)이라 아래에
   기본값으로 둡니다. 남는 비밀은 관리자 토큰 하나이고, 그것만 '설정 코드'로 한 번
   옮기면 됩니다. 코드에는 토큰이 들어 있으므로 남에게 보내면 안 됩니다. */
const DEFAULT_GS='https://script.google.com/macros/s/AKfycbyULnOlwGCrwEjeqgocZhZjh8pMazeaEvl8H78vd7RV61aX9HKq0a6tS_0KWZcf7Ufjhg/exec';
const SETUP_PREFIX='EVERAFTER-SETUP:';
function setupCode(){
  const c=DB.conn||{};
  const body={v:1,gs:c.gs||'',ask:c.ask||'',journey:c.journey||'',token:c.token||'',
    inquiryGs:c.inquiryGs||'',homepage:c.homepage||'',longLink:!!c.longLink,
    pin:localStorage.getItem(AUTH_KEY)||''};
  return SETUP_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(body))));
}
function applySetupCode(code){
  let raw=String(code||'').trim().replace(/\s+/g,'');
  if(!raw) throw new Error('붙여넣은 내용이 없습니다.');
  /* 접두어(EVERAFTER-SETUP:)가 붙어 있으면 떼고, 없어도 그냥 풀어봅니다.
     앞부분만 빠뜨리고 붙여넣는 일이 잦은데 그때마다 막으면 방법이 없습니다. */
  const at=raw.indexOf(SETUP_PREFIX);
  if(at>-1) raw=raw.slice(at+SETUP_PREFIX.length);
  let o=null;
  try{ o=JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e){ o=null; }
  if(!o||typeof o!=='object'){
    throw new Error('설정 코드가 아닙니다. 붙여넣은 내용이 "'+raw.slice(0,14)+'…" 로 시작하는데, '
      +'"EVERAFTER-SETUP:" 부터 끝까지 통째로 복사해 주세요.');
  }
  if(!o||!o.token) throw new Error('코드에 관리자 토큰이 없습니다.');
  DB.conn=Object.assign(DB.conn||{},{
    gs:o.gs||DEFAULT_GS, ask:o.ask||'', journey:o.journey||'', token:o.token,
    inquiryGs:o.inquiryGs||'', homepage:o.homepage||'', longLink:!!o.longLink});
  if(o.pin) localStorage.setItem(AUTH_KEY,o.pin);
  save();
  return o;
}
/* 설정만 받아온 기기에는 예식이 하나도 없습니다. 시트에 있는 것을 그대로 내려받습니다. */
async function pullAllFromSheet(){
  const list=await fetchBackups();
  let added=0;
  list.forEach(b=>{
    const d=b&&b.data;
    if(!d||!d.id||d.deletedAt) return;
    if(DB.list.some(x=>x.id===d.id)) return;
    const w=JSON.parse(JSON.stringify(d));
    SEC_DEFS.forEach(s=>{ if(!w.sections[s.key]) w.sections[s.key]={on:!s.off,cue:s.cue,music:'',text:null}; });
    DB.list.push(w); added++;
  });
  if(added){ const first=DB.list.find(w=>!w.deletedAt); if(first) DB.cur=first.id; save(); }
  return added;
}

/* 설정 화면은 두 곳에서 그려지므로 문서 단위로 한 번만 걸어둡니다 */
document.addEventListener('click',e=>{
  /* 복사 버튼이 휴대폰에서 조용히 실패하는 일이 있어, 코드를 화면에도 보여줍니다.
     버튼이 안 먹으면 글을 직접 길게 눌러 복사할 수 있습니다. */
  if(e.target&&e.target.id==='cCopySetup'){
    const code=setupCode();
    openModal('설정 코드',
      `<div class="pv-note" style="margin-bottom:12px">새 기기에서 <b>응답 링크 → 설정 코드 붙여넣기</b>(또는 잠금 화면의 링크)에 아래 글을 통째로 넣으세요.
         <b>EVERAFTER-SETUP: 부터 맨 끝까지</b> 전부 필요합니다.<br>
         복사 버튼이 안 먹으면 아래 칸을 길게 눌러 직접 복사하셔도 됩니다.</div>
       <textarea id="setupCodeBox" readonly style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;word-break:break-all">${esc(code)}</textarea>
       <div class="hint" style="margin-top:10px">이 코드에는 관리자 토큰이 들어 있습니다. 남에게 보내지 마세요.</div>`,
      `<button class="btn" id="scClose">닫기</button>
       <button class="btn primary" id="scCopy">복사</button>`);
    document.getElementById('scClose').onclick=closeModal;
    document.getElementById('scCopy').onclick=()=>{
      const ta=document.getElementById('setupCodeBox');
      ta.focus(); ta.select(); ta.setSelectionRange(0,code.length);
      copyText(code,'설정 코드를 복사했습니다.');
    };
  }
  /* 잠금이 이미 풀린 기기에서는 잠금 화면을 볼 일이 없으므로 여기서도 받을 수 있게 합니다 */
  if(e.target&&e.target.id==='cPasteSetup'){
    const code=prompt('쓰던 기기에서 복사한 설정 코드를 붙여넣어 주세요.');
    if(code===null) return;
    try{
      applySetupCode(code);
      toast('설정을 받았습니다. 예식 자료를 내려받는 중…');
      pullAllFromSheet()
        .then(n=>{ renderAll(); renderDashboard();
          toast(n?`예식 ${n}건을 가져왔습니다.`:'설정만 받았습니다. 새로 가져올 예식은 없습니다.',4200); })
        .catch(e2=>toast(authErr_(e2.message,'자료를 내려받지 못했습니다.'),5000));
    }catch(err){ toast(err&&err.message?err.message:String(err),5000); }
  }
});

const AUTH_KEY='mc-auth-hash', AUTH_UNTIL_KEY='mc-auth-until', AUTH_TTL=12*3600*1000;
function pinHash(s){
  s=String(s);
  let h1=0x811c9dc5, h2=0x1000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=Math.imul(h1^c,16777619);
    h2=Math.imul(h2+c,2654435761);
  }
  return (h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
}
function authValid(){ return Date.now()<Number(localStorage.getItem(AUTH_UNTIL_KEY)||0); }
function unlock(){ document.getElementById('lockScreen').hidden=true; load(); }
function lockBody(mode,msg){
  const el=document.getElementById('lockBody');
  const setup=mode==='setup';
  el.innerHTML=`
    <p style="color:var(--ink2);font-size:14px;margin:0 0 16px">${setup?'처음 사용하시는군요. 이 브라우저에서 쓸 번호를 정해 주세요.':'번호를 입력해 주세요.'}</p>
    <input type="password" id="lockPw" inputmode="numeric" placeholder="${setup?'새 번호 (4자리 이상)':'번호'}" autocomplete="off">
    <button class="btn primary" id="lockGo">${setup?'설정하고 시작하기':'확인'}</button>
    <div class="err" id="lockErr">${msg?esc(msg):''}</div>
    ${setup?'':'<a href="#" id="lockForgot" style="font-size:12px;color:var(--ink3)">번호를 잊으셨나요? 번호만 초기화</a>'}
    <a href="#" id="lockSetupCode" style="font-size:12px;color:var(--wine);font-weight:600;margin-top:6px;display:inline-block">쓰던 기기가 있나요? 설정 코드로 한 번에 옮기기</a>
    <div class="hint">같은 컴퓨터를 쓰는 다른 사람이 예식 정보를 함부로 열어보지 못하도록 막는 화면입니다.<br>번호는 이 브라우저에만 저장되며, 저장된 예식 자료와는 별개입니다.</div>`;
  const go=()=>{
   try{
    const pw=document.getElementById('lockPw').value.trim();
    if(setup){
      if(pw.length<4){ lockBody('setup','4자리 이상으로 정해 주세요.'); return; }
      localStorage.setItem(AUTH_KEY,pinHash(pw));
      localStorage.setItem(AUTH_UNTIL_KEY,String(Date.now()+AUTH_TTL));
      unlock();
    }else{
      const hash=pinHash(pw);
      if(hash===localStorage.getItem(AUTH_KEY)){
        localStorage.setItem(AUTH_UNTIL_KEY,String(Date.now()+AUTH_TTL));
        unlock();
      }else{ lockBody('login','번호가 맞지 않습니다.'); }
    }
   }catch(err){ lockBody(mode,'오류가 발생했습니다: '+(err&&err.message?err.message:String(err))); }
  };
  document.getElementById('lockGo').onclick=go;
  el.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }));
  const forgot=document.getElementById('lockForgot');
  if(forgot) forgot.onclick=e=>{
    e.preventDefault();
    if(!confirm('번호를 초기화할까요?\n저장된 예식 자료는 그대로 남고, 번호만 새로 설정하게 됩니다.')) return;
    localStorage.removeItem(AUTH_KEY); localStorage.removeItem(AUTH_UNTIL_KEY);
    lockBody('setup');
  };
  const codeLink=document.getElementById('lockSetupCode');
  if(codeLink) codeLink.onclick=e=>{ e.preventDefault(); lockSetupForm(); };
  const first=document.getElementById('lockPw'); if(first) first.focus();
}
/* 쓰던 기기에서 만든 설정 코드를 붙여넣는 화면 */
function lockSetupForm(msg){
  const el=document.getElementById('lockBody');
  el.innerHTML=`
    <p style="color:var(--ink2);font-size:14px;margin:0 0 14px;line-height:1.6">
      쓰던 기기에서 <b>응답 링크 → 설정 코드 복사</b>를 누른 뒤, 여기에 붙여넣어 주세요.<br>
      주소·토큰·번호가 한 번에 옮겨지고 예식 자료도 자동으로 내려받습니다.</p>
    <textarea id="lockCode" placeholder="EVERAFTER-SETUP:…" autocomplete="off"
      style="width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;word-break:break-all"></textarea>
    <button class="btn primary" id="lockCodeGo">이 코드로 시작하기</button>
    <div class="err" id="lockErr">${msg?esc(msg):''}</div>
    <a href="#" id="lockBackPin" style="font-size:12px;color:var(--ink3)">코드 없이 새로 시작하기</a>
    <div class="hint">설정 코드에는 관리자 토큰이 들어 있습니다. 남에게 보내지 마세요.</div>`;
  document.getElementById('lockBackPin').onclick=e=>{ e.preventDefault(); lockBody('setup'); };
  document.getElementById('lockCodeGo').onclick=async()=>{
    const btn=document.getElementById('lockCodeGo');
    try{
      applySetupCode(document.getElementById('lockCode').value);
      btn.disabled=true; btn.textContent='자료를 내려받는 중…';
      localStorage.setItem(AUTH_UNTIL_KEY,String(Date.now()+AUTH_TTL));
      let n=0;
      try{ n=await pullAllFromSheet(); }catch(e){ /* 자료는 나중에 시트에서 불러오면 됩니다 */ }
      unlock();
      toast(n?`설정을 옮기고 예식 ${n}건을 가져왔습니다.`:'설정을 옮겼습니다. 자료는 "시트에서 불러오기"로 가져오세요.',4200);
    }catch(err){
      btn.disabled=false; btn.textContent='이 코드로 시작하기';
      lockSetupForm(err&&err.message?err.message:String(err));
    }
  };
  document.getElementById('lockCode').focus();
}
function initAuth(){
  if(authValid()){ load(); return; }
  document.getElementById('lockScreen').hidden=false;
  lockBody(localStorage.getItem(AUTH_KEY)?'login':'setup');
}

initAuth();
</script>
